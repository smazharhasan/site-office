# Builds a ready-to-run image of Frappe 16 + ERPNext 16 + Mimaar for a laptop or server
# (Docker), using frappe_docker's official layered build. Apple silicon (arm64) and Intel/AMD.
name: Build the Mimaar ERP image
on:
  push: { branches: [erpnext-app] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: mimaar-image, cancel-in-progress: true }
env:
  IMAGE: ghcr.io/smazharhasan/mimaar-erpnext

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: frappe/frappe_docker, path: frappe_docker }
      - name: Apps in the image
        run: |
          printf '[{"url":"https://github.com/frappe/erpnext","branch":"version-16"},{"url":"https://github.com/%s","branch":"%s"}]' \
            "${{ github.repository }}" "${{ github.ref_name }}" > apps.json
          cat apps.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secret-files: apps_json=apps.json
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mimaar on Frappe 16 + ERPNext 16
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:16-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: One tag for both kinds of computer
        run: |
          docker buildx imagetools create -t $IMAGE:16 -t $IMAGE:latest $IMAGE:16-arm64 $IMAGE:16-amd64
          docker buildx imagetools inspect $IMAGE:16
