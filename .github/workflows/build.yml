# Builds the Buildiary Android app on every change and attaches the APK to the "latest" release
# (and to one release per version, buildiary-v<version>). The version is in the VERSION file.
name: Build the Buildiary app
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: build, cancel-in-progress: true }

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        run: echo "VER=$(cat ../VERSION)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Use the project's fixed signing key (so updates install over the installed app)
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore
          else cp signing/buildiary.keystore android/app/debug.keystore; fi
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: mkdir -p ../out && cp android/app/build/outputs/apk/release/app-release.apk ../out/Buildiary.apk && cp ../out/Buildiary.apk ../out/Buildiary-${{ env.VER }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Buildiary (latest)
          body: |
            **Buildiary.apk**: the Buildiary Android app, version ${{ env.VER }}. Install it on the phone; the first
            time it asks for your workspace name (e.g. alnoor for alnoor.buildiary.app).
            Built from ${{ github.sha }}.
          files: out/Buildiary.apk
          make_latest: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: buildiary-v${{ env.VER }}
          name: Buildiary ${{ env.VER }}
          body: "Buildiary (Android) ${{ env.VER }}: opens your Buildiary workspace. Built from ${{ github.sha }}."
          files: out/Buildiary-${{ env.VER }}.apk
          make_latest: false
