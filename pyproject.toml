[project]
name = "mimaar"
authors = [
    { name = "SMH Global Services (Pvt) Ltd", email = "info@smhglobal.com.pk"}
]
description = "Mimaar: construction procurement, stores, supplier accounts and site management on ERPNext"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
