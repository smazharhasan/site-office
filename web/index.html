/* ---------- photos & AI ---------- */
function d2b(d){ const i = d.indexOf(","); const mime = (d.slice(0, i).match(/:(.*?);/) || [])[1] || "image/jpeg"; const bin = atob(d.slice(i + 1)); const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], {type: mime}); }
function downscale(file, max = 1024, q = .62, cap = 190000){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); let m = max, qq = q, d = "";
      for (let i = 0; i < 8; i++){ const sc = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); d = c.toDataURL("image/jpeg", qq); if (d.length <= cap) break; if (qq > .4) qq -= .1; else m = Math.round(m * .8); }
      res({dataUrl: d, blob: d2b(d)}); };
    img.onerror = () => rej(new Error("Not an image")); img.src = url;
  });
}
function aiError(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") return "AI is not available here. Allow Claude for this page to use it.";
  if (c === "rate_limited") return "Too many AI requests right now. Try again in a minute.";
  if (c === "image_rejected" || c === "images_unavailable") return "This photo couldn't be sent for analysis. Try a JPEG or PNG.";
  if (c === "invalid_json") return "The analysis came back incomplete. Try again.";
  return "The AI request failed. Try again.";
}

/* ---------- derived numbers ---------- */
function poDelivered(po){ return sum(S.data.grns.filter(g => g.poId === po.id), g => g.qtyAccepted); }
function poAmount(po){ return num(po.qty) * num(po.unitPrice); }
function stock(mid){ const mv = moves(mid); const r = sum(mv.filter(x => x.type === "in"), x => x.qty), i = sum(mv.filter(x => x.type === "out"), x => x.qty), b = sum(mv.filter(x => x.type === "back"), x => x.qty);
  return {received: r, issued: i, back: b, onHand: r - i + b, onOrder: sum(S.data.pos.filter(p => p.materialId === mid && ["Approved","Issued"].includes(p.status)), p => Math.max(0, num(p.qty) - poDelivered(p)))}; }
function budgetLine(b){
  let committed = 0, spent = 0;
  if (String(b.link || "").startsWith("Payments: ")){ const ph = b.link.slice(10); const ps = S.data.payments.filter(p => p.phase === ph);
    committed = sum(ps, p => num(p.amount) - num(p.adjustment)); spent = sum(ps.filter(p => p.status === "Paid"), p => num(p.amount) - num(p.adjustment)); }
  else { const pos = S.data.pos.filter(p => p.budgetId === b.id && !["Cancelled","Pending approval"].includes(p.status)); committed = sum(pos, poAmount); spent = sum(pos.filter(p => p.payStatus === "Paid"), poAmount); }
  return {committed, spent};
}
function overallProgress(){ if (S.data.stages.length) return weighted(stageEff); const ms = S.data.milestones; const w = sum(ms, m => num(m.weight) || 1); return w ? sum(ms, m => (num(m.weight) || 1) * Math.min(100, num(m.status === "Done" ? 100 : m.progress))) / w : 0; }
function plannedProgress(){ if (S.data.stages.length) return weighted(stagePlanned); const ms = S.data.milestones; const t = today(); const w = sum(ms, m => num(m.weight) || 1); if (!w) return 0;
  return sum(ms, m => { const wt = num(m.weight) || 1; if (!m.planStart || !m.planEnd) return 0; if (t >= m.planEnd) return wt * 100; if (t <= m.planStart) return 0;
    return wt * 100 * (new Date(t) - new Date(m.planStart)) / (new Date(m.planEnd) - new Date(m.planStart)); }) / w; }
const isLate = m => m.status !== "Done" && m.planEnd && m.planEnd < today();
function nextNo(col, prefix){ const n = S.data[col].length + 1; return prefix + "-" + String(n).padStart(3, "0"); }
function supplierName(id){ return (get("suppliers", id) || {}).name || "—"; }
function matName(id){ const m = get("materials", id); return m ? m.name : "—"; }
function matUnit(id){ return (get("materials", id) || {}).unit || ""; }
function pill(status, force){
  const s = String(status || ""); let c = "";
  if (force != null) return `<span class="pill ${force}">${esc(t(s) || "—")}</span>`;
  if (/^(Done|Paid|Passed|Approved|Delivered|Accepted|Received|Closed|Credited|NCR closed|Awarded|Replaced)/.test(s)) c = "good";
  else if (/(Failed|Rejected|Blocked|Cancelled|Disputed|late|Fail$)/i.test(s)) c = "bad";
  else if (/(Pending|Claimed|Requested|Open|Due|In progress|Partial|Raised|Dispatched|Under review|Submitted|comments)/.test(s)) c = "warn";
  else if (/(Issued|Scheduled)/.test(s)) c = "info";
  return `<span class="pill ${c}">${esc(t(s) || "—")}</span>`;
}

/* ---------- charts ---------- */
const fmtN = v => { v = num(v); const a = Math.abs(v); return a >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, "") + "L" : a >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(v * 10) / 10); };
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
const legend = items => `<div class="legend">${items.map(([n, c, dash]) => `<span><i style="background:${c};${dash ? "background:none;border:1.5px dashed " + c : ""}"></i>${esc(n)}</span>`).join("")}</div>`;
function barChart(labels, series, opts = {}){
  const W = 640, H = opts.h || 220, L = 46, R = 8, T = 10, B = 28; const n = labels.length;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values.map(num))));
  const cw = (W - L - R) / n; const bw = Math.min(24, (cw - 6) / series.length);
  let g = "";
  for (let i = 0; i <= 4; i++){ const v = max * i / 4; const y = T + (H - T - B) * (1 - i / 4); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${fmtN(v)}</text>`; }
  labels.forEach((lb, i) => { const x0 = L + cw * i + (cw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = num(s.values[i]); const h = (H - T - B) * v / max;
      if (v > 0) g += `<rect x="${(x0 + j * bw).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:${s.color}"><title>${esc(s.name)}, ${esc(lb)}: ${fmtN(v)}</title></rect>`; });
    if (n <= 12 || i % 2 === (n - 1) % 2) g += `<text x="${(L + cw * i + cw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${esc(lb)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Bar chart")}">${g}</svg>`;
}
function lineChart(labels, series, opts = {}){
  const W = 640, H = opts.h || 190, L = 46, R = 12, T = 10, B = 28; const n = labels.length;
  const max = opts.max || niceMax(Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null).map(num))));
  const x = i => L + (W - L - R) * (n <= 1 ? .5 : i / (n - 1)); const y = v => T + (H - T - B) * (1 - num(v) / max);
  let g = "";
  for (let i = 0; i <= 4; i++){ const v = max * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmtN(v)}${opts.unit || ""}</text>`; }
  series.forEach(s => { const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (!pts.length) return;
    if (s.area) g += `<path d="M${pts[0][0].toFixed(1)},${y(0)} ${pts.map(p => "L" + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")} L${pts[pts.length - 1][0].toFixed(1)},${y(0)} Z" style="fill:${s.color};opacity:.15"/>`;
    g += `<polyline points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:${s.color};stroke-width:2.2"/>`;
    const lp = pts[pts.length - 1]; g += `<circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="4" style="fill:${s.color}"/>`; });
  labels.forEach((lb, i) => { if (n <= 12 || i % 2 === (n - 1) % 2) g += `<text x="${x(i).toFixed(1)}" y="${H - 9}" text-anchor="middle">${esc(lb)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Line chart")}">${g}</svg>`;
}
function buckets(period){
  const out = []; const t = new Date(today() + "T00:00:00");
  if (period === "day"){ for (let i = 13; i >= 0; i--){ const d = new Date(t); d.setDate(d.getDate() - i); out.push({s: isoL(d), e: isoL(d), l: d.toLocaleDateString("en-GB", {day: "numeric", month: "short"})}); } }
  else if (period === "week"){ const mon = new Date(t); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7)); for (let i = 11; i >= 0; i--){ const s = new Date(mon); s.setDate(s.getDate() - 7 * i); const e = new Date(s); e.setDate(e.getDate() + 6); out.push({s: isoL(s), e: isoL(e), l: s.toLocaleDateString("en-GB", {day: "numeric", month: "short"})}); } }
  else { for (let i = 11; i >= 0; i--){ const s = new Date(t.getFullYear(), t.getMonth() - i, 1), e = new Date(t.getFullYear(), t.getMonth() - i + 1, 0); out.push({s: isoL(s), e: isoL(e), l: s.toLocaleDateString("en-GB", {month: "short", year: "2-digit"})}); } }
  return out;
}
function ptd(){ const t = new Date(today() + "T00:00:00"); const mon = new Date(t); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7)); return {day: [today(), today()], week: [isoL(mon), today()], month: [isoL(new Date(t.getFullYear(), t.getMonth(), 1)), today()]}; }
const inR = (d, r) => d && d >= r[0] && d <= r[1];

/* ---------- AI verification on forms ---------- */
const AI_CHECKS = {
  grns: r => { const po = get("pos", r.poId) || {}; const mt = get("materials", po.materialId) || {}; const checks = String(mt.specChecks || "").split("\n").map(x => x.trim()).filter(Boolean); return {imgs: [r.photo, r.photo2, r.photo3], need: "a photo of the delivery", prompt: `Verify a construction material delivery received at a house site in Bahria Town Karachi. Purchase order ${po.no || "?"}: ${mt.name || "?"}, ordered ${num(po.qty)} ${mt.unit || ""} from ${supplierName(po.supplierId)}. Approved specification: ${mt.spec || "not stated"}. Recorded at the gate: received ${num(r.qtyReceived)}, accepted ${num(r.qtyAccepted)}, rejected ${num(r.qtyRejected)}, vehicle ${r.vehicle || "?"}, bill/challan ${r.billNo || "?"}, weighbridge ${r.weighbridge || "n/a"} kg, brand noted "${r.brand || ""}". PO rate Rs ${num(po.unitPrice)} per ${mt.unit || "unit"}. The images, in order, are: the truck and material; the supplier bill, challan or weighbridge slip; and a close-up of the brand marking, bag print, bar rolling marks or mill certificate (any may be missing). Read the bill and check it against the PO. Check every specification item below against what is visible on the material, its markings and the bill, and judge each one pass, fail or cannot tell, quoting the evidence you saw. Spec items:\n${(checks.length ? checks : [mt.spec || "Material matches the approved specification"]).map((x, i) => (i + 1) + ". " + x).join("\n")}\nUse verdict "mismatch" if any spec item fails or the bill contradicts the PO, "check" if items cannot be confirmed. Reply with only JSON: {"verdict": "verified"|"check"|"mismatch", "summary": string, "specChecks": [{"item": string, "result": "pass"|"fail"|"cannot tell", "evidence": string}], "billReading": {"supplier": string, "billNo": string, "date": string, "material": string, "qty": string, "rate": string, "amount": string}, "billMatchesPO": "yes"|"no"|"unclear", "billIssues": [string], "materialSeen": string, "brandOrMarking": string, "estimatedQuantity": string, "quantityConsistent": "yes"|"no"|"unclear", "conditionIssues": [string], "storageAdvice": string}`}; },
  issues: r => ({imgs: [r.photoOut, r.photoAt], need: "a photo of the material", prompt: `Verify a material movement at a house construction site store in Bahria Town Karachi. Recorded: ${r.kind || "Release to work"} of ${num(r.qty)} ${matUnit(r.materialId)} of ${matName(r.materialId)}, ${r.kind === "Return to store" ? "returned by" : "released to"} ${r.issuedTo || "?"} for stage "${(get("stages", r.stageId) || {}).name || "?"}", area "${r.work || ""}". The images show the material leaving the store and/or at the work location. Check that the material and quantity visible match the record and that it is being used where stated. Reply with only JSON: {"verdict": "verified"|"check"|"mismatch", "summary": string, "materialSeen": string, "estimatedQuantity": string, "quantityConsistent": "yes"|"no"|"unclear", "locationMatchesWork": "yes"|"no"|"unclear", "wasteOrMisuseSigns": [string], "safetyIssues": [string]}`}),
  water: r => ({imgs: [r.photo, r.photo2], need: "a photo of the tanker", prompt: `Verify a water tanker delivery at a house construction site in Bahria Town Karachi. Recorded: tanker ${r.tankerNo || "?"}, ${num(r.gallons)} gallons, ${r.waterType || ""}, TDS ${r.tds || "not recorded"} ppm, emptied into ${r.toTank || "?"}. The images show the tanker with its number plate and, if present, a TDS meter or water sample. Water above about 1,000 ppm TDS is unsuitable for concrete and curing. Reply with only JSON: {"verdict": "verified"|"check"|"mismatch", "summary": string, "plateRead": string, "plateMatches": "yes"|"no"|"unclear", "tankerSizeEstimateGallons": number, "waterAppearance": string, "tdsReadingSeen": string, "concerns": [string]}`}),
  tank: r => ({imgs: [r.photo], need: "a photo inside the tank", prompt: `Estimate the water level in the ${r.tank || "tank"} at a house construction site from this photo taken through the manhole or of the tank. Recorded level: ${num(r.levelPct)}% full. Reply with only JSON: {"verdict": "verified"|"check"|"mismatch", "summary": string, "estimatedLevelPct": number, "levelConsistent": "yes"|"no"|"unclear", "waterClarity": "clear"|"slightly turbid"|"turbid"|"not visible", "contamination": [string], "structuralConcerns": [string]}`}),
};
async function runFormAI(){
  const r = readForm(); const spec = AI_CHECKS[modalState.col](r); const imgs = spec.imgs.filter(Boolean); const box = $("#aiRes");
  if (!S.sample){ box.innerHTML = `<div class="ai">AI isn't available in this view.</div>`; return; }
  if (!imgs.length){ toast("Add " + spec.need + " first."); return; }
  box.innerHTML = `<div class="ai">Checking the photos… this can take up to a minute.</div>`;
  try { const ai = await S.sample.json(spec.prompt, {images: imgs.slice(0, S.imgMax || 1).map(d2b)}); modalState.rec.ai = ai; box.innerHTML = aiBlock(ai, "AI verification") + `<p class="small muted" style="margin:6px 0 0">Saved with the record when you press Save.</p>`; }
  catch(e){ box.innerHTML = `<div class="ai">${esc(aiError(e))}</div>`; }
}
function verdictPill(a){ if (!a || !a.verdict) return pill("Not checked", ""); const v = a.verdict; return pill(v === "verified" ? "AI verified" : v === "mismatch" ? "AI mismatch" : "AI: check", v === "verified" ? "good" : v === "mismatch" ? "bad" : "warn"); }
function aiBlock(a, title){
  if (!a || typeof a !== "object") return `<div class="ai">No reading.</div>`;
  const lab = k => k.replace(/([A-Z])/g, " $1").replace(/Pct/g, "%").replace(/^./, c => c.toUpperCase());
  const skip = ["summary", "verdict", "riskLevel", "recommendation", "specChecks"];
  let h = `<div class="ai"><div class="row"><h3 style="margin:0">${esc(title || "AI reading")}</h3>${a.verdict ? verdictPill(a) : ""}${a.riskLevel ? pill("Risk: " + a.riskLevel, a.riskLevel === "high" ? "bad" : a.riskLevel === "medium" ? "warn" : "good") : ""}</div>${a.summary ? `<p style="margin:6px 0">${esc(a.summary)}</p>` : ""}`;
  if (Array.isArray(a.specChecks) && a.specChecks.length){ const pc = a.specChecks.filter(x => /pass/i.test(x.result)).length, fc = a.specChecks.filter(x => /fail/i.test(x.result)).length; h += `<div style="margin:6px 0"><b>Specification check</b> ${pill(pc + " pass", "good")} ${fc ? pill(fc + " fail", "bad") : ""} ${a.specChecks.length - pc - fc ? pill((a.specChecks.length - pc - fc) + " unclear", "warn") : ""}<div class="tbl"><table><tbody>${a.specChecks.map(x => `<tr><td>${esc(x.item || "")}</td><td>${pill(x.result || "", /pass/i.test(x.result) ? "good" : /fail/i.test(x.result) ? "bad" : "warn")}</td><td class="small">${esc(x.evidence || "")}</td></tr>`).join("")}</tbody></table></div></div>`; }
  Object.entries(a).forEach(([k, v]) => { if (skip.includes(k) || v == null || v === "") return;
    if (Array.isArray(v)){ if (!v.length) return; h += `<div><b>${esc(lab(k))}</b><ul style="margin:2px 0 4px 18px;padding:0">${v.map(x => `<li>${esc(x && typeof x === "object" ? Object.values(x).join(": ") : x)}</li>`).join("")}</ul></div>`; }
    else if (typeof v === "object") h += `<div><b>${esc(lab(k))}:</b> ${esc(Object.values(v).join(", "))}</div>`;
    else h += `<div><b>${esc(lab(k))}:</b> ${esc(v)}</div>`; });
  if (a.recommendation) h += `<div><b>Do next:</b> ${esc(a.recommendation)}</div>`;
  return h + `</div>`;
}

/* camera & AI */
function camCard(c){
  const a = c.ai || {}; const risk = a.riskLevel || (a.safetyIssues && a.safetyIssues.length ? "medium" : "");
  return `<div class="card" data-open="camera" data-id="${c.id}" style="cursor:pointer">${c.photo ? `<img src="${c.photo}" alt="${esc(c.mode)} photo, ${esc(c.location || "")}">` : ""}<div class="row"><b>${esc(c.mode)}</b>${risk ? pill(risk === "high" ? "High risk" : risk === "medium" ? "Medium risk" : "Low risk", risk === "high" ? "bad" : risk === "medium" ? "warn" : "good") : ""}<span class="spacer"></span><span class="small muted">${fmtD(c.date)}</span></div><span class="small muted">${esc(c.location || "")}</span><span class="small">${esc(String(a.summary || c.note || "").slice(0, 160))}</span></div>`;
}
VIEWS.camera = () => {
  const rows = S.data.camera.slice().sort((a, b) => String(b.createdAt || b.date).localeCompare(String(a.createdAt || a.date)));
  const curMs = S.data.milestones.filter(m => m.status === "In progress").map(m => m.name).join(", ") || "—";
  return panel("Capture & analyse", `<div class="body" style="display:flex;flex-direction:column;gap:12px">
    <div class="form">
      <div class="fld"><label for="camMode">Check for</label><select id="camMode"><option>Progress</option><option>Security & safety</option><option>Quality</option><option>Material delivery</option></select></div>
      <div class="fld"><label for="camLoc">Location / view</label><input id="camLoc" placeholder="e.g. Front elevation, first-floor slab, store yard"></div>
      <div class="fld full"><label for="camFile">Photo</label><input id="camFile" type="file" accept="image/*" capture="environment"></div>
    </div>
    <div id="camPrev"></div>
    <div class="row"><button class="btn pri" id="camGo" disabled>Analyse with AI</button><button class="btn" id="camSave" disabled>Save without AI</button><span class="small muted" id="camMsg">Work in progress now: ${esc(curMs)}</span></div>
    <div id="camOut"></div></div>`)
  + panel("Photo log", rows.length ? `<div class="body cards">${rows.map(camCard).join("")}</div>` : `<div class="empty"><b>No photos yet</b>Each photo is stored with its AI reading, so progress and security can be reviewed over time.</div>`)
  + `<p class="small muted">Take a photo on a phone or upload a still from the site CCTV. The AI compares it with the current programme stage and flags quality, safety and security concerns. Treat its reading as a prompt for inspection, not a sign-off.</p>`;
};
VIEWS_AFTER.camera = () => {
  let shot = null; const f = $("#camFile"), goB = $("#camGo"), sv = $("#camSave"), out = $("#camOut"), msg = $("#camMsg");
  if (!S.sample){ goB.title = "AI isn't available in this view"; }
  f.onchange = async () => { if (!f.files[0]) return; try { shot = await processPhoto(f.files[0], {label: "Camera"}); $("#camPrev").innerHTML = `<img class="photo" style="max-height:320px" src="${shot.dataUrl}" alt="Selected photo">${metaHtml(shot.meta)}`; goB.disabled = !S.sample; sv.disabled = false; } catch(e){ toast("That file isn't a readable image."); } };
  sv.onclick = async () => { if (!shot) return; await save("camera", {date: today(), mode: $("#camMode").value, location: $("#camLoc").value, photo: shot.dataUrl, meta: {photo: shot.meta}}); toast("Photo saved"); render(); };
  goB.onclick = async () => {
    if (!shot || !S.sample) return; goB.disabled = true; sv.disabled = true; msg.textContent = "Analysing… this can take up to a minute.";
    const mode = $("#camMode").value, loc = $("#camLoc").value;
    const ms = S.data.milestones.filter(m => m.status === "In progress" || (m.planStart <= today() && m.planEnd >= today())).map(m => `${m.name} (planned ${m.planStart} to ${m.planEnd}, reported ${num(m.progress)}%)`).join("; ");
    const base = `You are reviewing a site photo for a 6,500 sft ground + first floor modern villa with a swimming pool, under construction: ${projDesc()}. Location/view: ${loc || "not stated"}. Programme stages planned around today (${today()}): ${ms || "unknown"}. Contract quality rules include: ready-mix concrete for slabs on ply shuttering, Grade 60 steel with cover blocks, 10-day ponding cure for slabs, waterproofing ponding tests, wire mesh at RCC–block joints, PPE and edge protection, material stored off the ground and covered.`;
    const ask = mode === "Security & safety"
      ? `${base}\nCheck security and safety. Reply with only JSON: {"summary": string (2 sentences), "peopleCount": number, "ppe": "good"|"partial"|"poor"|"not visible", "safetyIssues": [string], "securityRisks": [string], "materialStorage": string, "riskLevel": "low"|"medium"|"high", "recommendation": string}`
      : mode === "Material delivery"
      ? `${base}\nThis photo shows a material delivery. Reply with only JSON: {"summary": string, "materialSeen": string, "estimatedQuantity": string, "visibleBrandOrMarking": string, "conditionIssues": [string], "safetyIssues": [string], "riskLevel": "low"|"medium"|"high", "recommendation": string}`
      : `${base}\nCheck ${mode === "Quality" ? "workmanship quality" : "construction progress"} against the programme. Reply with only JSON: {"summary": string (2 sentences), "stageObserved": string, "progressPct": number (0-100, estimated completion of the stage in view), "onProgramme": "ahead"|"on track"|"behind"|"unclear", "qualityIssues": [string], "safetyIssues": [string], "riskLevel": "low"|"medium"|"high", "recommendation": string}`;
    out.innerHTML = `<div class="ai">Thinking…</div>`;
    try {
      const ai = await S.sample.json(ask, {images: [shot.blob], modelTier: "default"});
      out.innerHTML = aiBlock(ai, mode);
      await save("camera", {date: today(), mode, location: loc, photo: shot.dataUrl, meta: {photo: shot.meta}, ai});
      msg.textContent = "Saved to the photo log."; toast("Analysis saved");
    } catch(e){ out.innerHTML = `<div class="ai">${esc(aiError(e))}</div>`; msg.textContent = ""; goB.disabled = false; sv.disabled = false; }
  };
};

VIEWS.assistant = () => `${panel("Ask the project", `<div class="body" style="display:flex;flex-direction:column;gap:10px">
  <p class="small muted" style="margin:0">Questions are answered from this app's live records: schedule, payments, budget, procurement, stock, inspections and site logs.</p>
  <div class="row">${["Are we on schedule? What's behind?","What do I owe the builder next and when?","Which materials need ordering this week?","Summarise this week's site logs and open NCRs","Draft a weekly progress report for the owner","How much cement and steel went out this week, and to whom?"].map(q => `<button class="btn sm" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  <div class="fld"><label for="askBox">Your question</label><textarea id="askBox" placeholder="e.g. How much steel have we received against the estimate?"></textarea></div>
  <div class="row"><button class="btn pri" id="askGo" ${S.sample ? "" : "disabled"}>Ask</button><button class="btn" id="askStop" hidden>Stop</button>${S.sample ? "" : `<span class="small muted">AI isn't available in this view.</span>`}</div>
  <div id="askOut"></div></div>`)}`;
function snapshotForAI(){
  const ms = S.data.milestones.map(m => ({name: m.name, phase: m.phase, planStart: m.planStart, planEnd: m.planEnd, status: m.status, progress: num(m.progress), late: isLate(m)}));
  const pays = S.data.payments.map(p => ({stage: p.stage, for: p.phase, net: num(p.amount) - num(p.adjustment), due: p.dueDate, status: p.status}));
  const bud = S.data.budget.map(b => Object.assign({line: b.item, budget: num(b.budget)}, budgetLine(b)));
  const stk = S.data.materials.map(m => Object.assign({material: m.name, unit: m.unit, estimate: num(m.budgetQty), reorder: num(m.reorder)}, stock(m.id)));
  const pos = S.data.pos.map(p => ({no: p.no, supplier: supplierName(p.supplierId), material: matName(p.materialId), qty: num(p.qty), amount: poAmount(p), status: p.status, delivered: poDelivered(p), pay: p.payStatus}));
  const ins = S.data.inspections.map(i => ({type: i.type, location: i.location, date: i.date, status: i.status, findings: i.findings}));
  const logs = S.data.logs.slice().sort(by("date")).reverse().slice(0, 14).map(l => ({date: l.date, labour: l.labour, work: l.work, issues: l.issues, weather: l.weather}));
  const cam = S.data.camera.slice().sort(by("date")).reverse().slice(0, 8).map(c => ({date: c.date, mode: c.mode, location: c.location, ai: c.ai && {summary: c.ai.summary, risk: c.ai.riskLevel}}));
  return JSON.stringify({today: today(), project: cfg(), overallProgressPct: Math.round(overallProgress()), plannedProgressPct: Math.round(plannedProgress()), milestones: ms, sbPayments: pays, budget: bud, stock: stk, purchaseOrders: pos, openRFQs: S.data.rfqs.filter(r => r.status === "Open").map(r => r.title), inspections: ins, recentLogs: logs, recentPhotos: cam, stages: stagesSorted().map(s => ({stage: s.name, planned: Math.round(stagePlanned(s)), reported: num(s.reported), verified: s.verified, aiFromPhotos: s.ai})), water: {tankersThisMonth: S.data.water.filter(x => inR(x.date, ptd().month)).length, gallonsThisMonth: sum(S.data.water.filter(x => inR(x.date, ptd().month)), x => x.gallons), lastTankReadings: S.data.tank.slice(-6).map(t => ({date: t.date, tank: t.tank, level: t.levelPct}))}, releasesThisWeek: S.data.issues.filter(x => inR(x.date, ptd().week)).map(x => ({date: x.date, material: matName(x.materialId), qty: num(x.qty), to: x.issuedTo, kind: x.kind, ai: x.ai && x.ai.verdict}))}).slice(0, 120000);
}
VIEWS_AFTER.assistant = () => {
  const box = $("#askBox"), goB = $("#askGo"), stop = $("#askStop"), out = $("#askOut"); let ctl = null;
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { box.value = b.dataset.q; goB.click(); });
  goB.onclick = async () => {
    const q = box.value.trim(); if (!q || !S.sample) return; goB.disabled = true; stop.hidden = false; ctl = new AbortController();
    out.innerHTML = `<div class="ai" id="askAns">Thinking…</div>`; const ans = $("#askAns");
    const prompt = `You are the project assistant for "Villa 31", a house construction project: ${projDesc()}. The person asking is the ${ROLES[S.role].label}. Answer from the JSON records below only; if the records don't hold the answer, say what is missing. Amounts are Pakistani rupees; write lac where natural. Be concise and use short bullet points.\n\nRECORDS:\n${snapshotForAI()}\n\nQUESTION: ${q}`;
    try { await S.sample(prompt, {signal: ctl.signal, cache: false, onText: ({text}) => { ans.textContent = text; }}); }
    catch(e){ if (e.code !== "cancelled") ans.textContent = (e.text ? e.text + "\n\n" : "") + aiError(e); }
    goB.disabled = false; stop.hidden = true;
  };
  stop.onclick = () => ctl && ctl.abort();
};

}
function uaDevice(){ const u = navigator.userAgent; const m = u.match(/Android [\d.]+; ([^;)]+?)(?: Build|\))/); if (m && m[1].trim().length > 2) return m[1].trim(); if (/iPhone/.test(u)) return "iPhone"; if (/iPad/.test(u)) return "iPad"; if (/Android/.test(u)) return "Android phone"; if (/Macintosh/.test(u)) return "Mac"; if (/Windows/.test(u)) return "Windows PC"; return "Unknown device"; }

const fmtDT = iso => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("en-GB", {day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"}); };

  if (!m.gps) f.push("No GPS"); else if (num(d.siteLat) && num(d.siteLng) && distM(m.gps, {lat: num(d.siteLat), lng: num(d.siteLng)}) > num(d.siteRadius || 500)) f.push("Away from site");

/* ---------- Gantt + critical path (Frappe Gantt) ---------- */
const dayN = d => Math.round(new Date(d + "T00:00:00").getTime() / 864e5);
const fromN = n => new Date(n * 864e5).toISOString().slice(0, 10);
function cpm(){
  const ms = S.data.milestones.filter(m => m.planStart && m.planEnd); const byId = Object.fromEntries(ms.map(m => [m.id, m]));
  const dur = m => Math.max(1, dayN(m.planEnd) - dayN(m.planStart) + 1); const ES = {}, EF = {}; const seen = new Set(), order = [];
  const visit = (id, stack = new Set()) => { if (seen.has(id) || stack.has(id)) return; stack.add(id); (byId[id].dependsOn || []).filter(p => byId[p]).forEach(p => visit(p, stack)); seen.add(id); order.push(id); };
  ms.forEach(m => visit(m.id));
  order.forEach(id => { const m = byId[id]; ES[id] = Math.max(dayN(m.planStart), ...(m.dependsOn || []).filter(p => byId[p]).map(p => EF[p] + 1)); EF[id] = ES[id] + dur(m) - 1; });
  const end = Math.max(...Object.values(EF), 0); const LF = {}, LS = {};
  order.slice().reverse().forEach(id => { const succ = ms.filter(x => (x.dependsOn || []).includes(id)); LF[id] = succ.length ? Math.min(...succ.map(s => LS[s.id] - 1)) : end; LS[id] = LF[id] - dur(byId[id]) + 1; });
  const out = {}; ms.forEach(m => { out[m.id] = {es: ES[m.id], ef: EF[m.id], float: LF[m.id] - EF[m.id], conflict: ES[m.id] > dayN(m.planStart), crit: LF[m.id] - EF[m.id] <= 0}; });
  out._end = end; return out;
}

function lookAhead(){

  S.data.subtasks.filter(x => x.status !== "Done" && inW(x.planStart || x.planEnd)).forEach(x => items.push({d: (x.planStart || x.planEnd) < t0 ? t0 : (x.planStart || x.planEnd), k: "Sub-task", t: x.title, sub: [personName(x.personId), supplierName(x.supplierId)].filter(Boolean).join(" · ") + ` · due ${fmtD(x.planEnd)}`, col: "subtasks", id: x.id, late: x.planEnd && x.planEnd < t0}));

  S.data.pos.forEach(r => add("pos", r, `${r.no || ""} ${matName(r.materialId)}`, `PO · ${supplierName(r.supplierId)} · ${rs(poAmount(r))}`));
  S.data.grns.forEach(r => add("grns", r, `${r.no || ""} ${matName(r.materialId || (get("pos", r.poId) || {}).materialId)}`, `GRN · ${fmtD(r.date)} · ${r.vehicle || ""} ${r.billNo || ""}`));
  S.data.suppliers.forEach(r => add("suppliers", r, r.name, `Supplier · ${r.category || ""} · ${r.phone || ""}`));
  S.data.materials.forEach(r => add("materials", r, r.name, `Material · ${r.code || ""} · ${r.spec || ""}`));
  S.data.people.forEach(r => add("people", r, r.name, `Person · ${r.trade || r.type || ""} · ${r.gang || ""} · BTK ${r.btkCard || ""} · ${is("owner", "ownerSup") ? r.cnic || "" : ""} · ${r.phone || ""}`));
  S.data.payments.forEach(r => add("payments", r, `${r.ref || ""} ${r.stage || ""}`, `Payment · ${r.status || ""} · ${rs(num(r.amount) - num(r.adjustment))}`));
  S.data.inspections.forEach(r => add("inspections", r, `${r.no || ""} ${r.type || ""}`, `Inspection · ${r.location || ""} · ${r.status || ""}`));
  S.data.snags.forEach(r => add("snags", r, `${r.no || ""} ${r.title}`, `Snag · ${r.location || ""} · ${r.status || ""}`));
  S.data.changes.forEach(r => add("changes", r, `${r.no || ""} ${r.title}`, `Change order · ${r.status || ""} · ${rs(r.cost || 0)}`));
  S.data.selections.forEach(r => add("selections", r, r.item, `Selection · ${r.area || ""} · ${r.chosen || ""}`));
  S.data.drawings.forEach(r => add("drawings", r, r.name, `Drawing · ${r.discipline || ""} · ${r.rev || ""}`));
  S.data.logs.forEach(r => add("logs", r, `Site log ${fmtD(r.date)}`, String(r.work || "").slice(0, 80)));

  NAV.filter(n => n.id && n.roles.split(" ").includes(S.role)).forEach(n => I.push({nav: n.id, title: t(n.label), sub: "Go to page"}));
  return I;

const NAVCOL = {milestones: "schedule", subtasks: "schedule", pos: "procurement", grns: "stores", suppliers: "suppliers", materials: "stores", people: "people", payments: "payments", inspections: "quality", snags: "snags", changes: "changes", selections: "changes", drawings: "snags", logs: "sitelog", stages: "progress"};
async function openSearch(){
  if (!S.role || $("#scrim")) return;
  $("#modalRoot").innerHTML = `<div class="scrim" id="scrim" style="align-items:flex-start;padding-top:8vh"><div class="modal" role="dialog" aria-modal="true" aria-label="Search" style="width:min(640px,100%)"><div class="body" style="gap:8px"><input id="qIn" class="qin" placeholder="${esc(t("Search"))}: PO, GRN, person, CNIC, BTK card, material, snag…" autocomplete="off"><div id="qOut" class="qout"><span class="small muted">Type to search every record you can see. Tip: Ctrl+K (⌘K) opens this anywhere.</span></div></div></div></div>`;
  const root = $("#scrim"); root.addEventListener("click", e => { if (e.target === root) closeModal(); }); root.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  const inp = $("#qIn"); inp.focus();
  try { await lib("fuse"); } catch(e){ $("#qOut").innerHTML = `<span class="small muted">Search couldn't load.</span>`; return; }
  const fuse = new Fuse(searchIndex(), {keys: [{name: "title", weight: 2}, "sub"], threshold: .38, ignoreLocation: true});
  let hits = [], cur = 0;
  const draw = () => { $("#qOut").innerHTML = hits.length ? hits.map((h, i) => `<button class="qhit${i === cur ? " on" : ""}" data-i="${i}"><b>${esc(h.title)}</b><span class="small muted">${esc(h.sub)}</span></button>`).join("") : `<span class="small muted">${inp.value ? "No match." : ""}</span>`; };
  const pick = i => { const h = hits[i]; if (!h) return; closeModal(); if (h.nav) return go(h.nav); const r = get(h.col, h.id); if (!r) return; if (NAVCOL[h.col] && S.view !== NAVCOL[h.col] && h.col !== "people") go(NAVCOL[h.col]); else if (h.col === "people") go("people"); openForm(h.col, r, false); };
  inp.oninput = () => { hits = inp.value.trim() ? fuse.search(inp.value.trim(), {limit: 12}).map(x => x.item) : []; cur = 0; draw(); };
  inp.onkeydown = e => { if (e.key === "ArrowDown"){ cur = Math.min(hits.length - 1, cur + 1); draw(); e.preventDefault(); } if (e.key === "ArrowUp"){ cur = Math.max(0, cur - 1); draw(); e.preventDefault(); } if (e.key === "Enter") pick(cur); };
  $("#qOut").onclick = e => { const b = e.target.closest("[data-i]"); if (b) pick(+b.dataset.i); };
}

async function pdfText(file, msg){
  await lib("pdfjs"); const pj = window.pdfjsLib; pj.GlobalWorkerOptions.workerSrc = CDN + "pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
  const doc = await pj.getDocument({data: await file.arrayBuffer()}).promise; let text = ""; const pages = [];
  for (let i = 1; i <= doc.numPages; i++){ msg && msg(`Reading page ${i} of ${doc.numPages}…`); const pg = await doc.getPage(i); const tc = await pg.getTextContent(); text += `\n--- page ${i} ---\n` + tc.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("");

  return {text, pages, numPages: doc.numPages};
}

function phaseProgress(ph){
  if (ph === "Grey" || ph === "Finishing"){ const st = S.data.stages.filter(s => s.phase === ph); if (st.length){ const w = sum(st, s => num(s.weight) || 1); return w ? sum(st, s => (num(s.weight) || 1) * stageEff(s) / 100) / w : 0; } }
  const c = cfg(); if (!c.startDate) return 0; return Math.max(0, Math.min(1, monthsBetween(c.startDate, today()) / MONTHS()));
}
function manDays(from, to){ return S.data.attendance.filter(a => a.date >= from && a.date <= to && a.in && ["Verified", "Approved"].includes(a.inStatus)).length; }
function invAnalysis(){
  const rows = [];
  S.data.materials.forEach(m => {
    const mv = moves(m.id); const rec = sum(mv.filter(x => x.type === "in"), x => x.qty); const out = sum(S.data.issues.filter(x => x.materialId === m.id && (x.kind || "Release to work") === "Release to work"), x => x.qty);
    const back = sum(S.data.issues.filter(x => x.materialId === m.id && x.kind === "Return to store"), x => x.qty); const lost = sum(S.data.issues.filter(x => x.materialId === m.id && x.kind === "Lost / damaged"), x => x.qty);
    const net = out - back; const st = stock(m.id); const flags = []; let score = 0;
    const first = mv.map(x => x.date).filter(Boolean).sort()[0]; const days = first ? Math.max(1, dayN(today()) - dayN(first) + 1) : 0;
    const last14 = sum(S.data.issues.filter(x => x.materialId === m.id && (x.kind || "Release to work") === "Release to work" && x.date >= fromN(dayN(today()) - 13)), x => x.qty) / 14;
    let expected = null;
    if (isCanteen(m) && num(m.normPerManDay) && first){ expected = num(m.normPerManDay) * manDays(first, today()); }
    else if (!isTool(m) && num(m.budgetQty) && m.phase !== "Site running"){ expected = num(m.budgetQty) * phaseProgress(m.phase || "Grey"); }
    const variance = expected != null && expected > 0 ? (net - expected) / expected * 100 : null;
    if (variance != null && variance > 15 && net > 0){ flags.push(`Used ${Math.round(variance)}% more than ${isCanteen(m) ? "the norm for the workers present" : "progress justifies"}`); score += variance > 40 ? 3 : 2; }
    if (lost > 0){ flags.push(`${fmtN(lost)} ${m.unit || ""} written off as lost/damaged`); score += 2; }
    const aiBad = S.data.issues.filter(x => x.materialId === m.id && x.ai && x.ai.verdict === "mismatch").length + S.data.grns.filter(g => (g.materialId || (get("pos", g.poId) || {}).materialId) === m.id && g.ai && g.ai.verdict === "mismatch").length;
    if (aiBad){ flags.push(`${aiBad} AI photo/bill mismatch${aiBad > 1 ? "es" : ""}`); score += 2 * aiBad; }
    const noPhoto = S.data.issues.filter(x => x.materialId === m.id && !x.photoOut).length; if (noPhoto){ flags.push(`${noPhoto} release${noPhoto > 1 ? "s" : ""} without a photo`); score += 1; }
    const unreg = S.data.issues.filter(x => x.materialId === m.id && !x.personId).length; if (unreg){ flags.push(`${unreg} release${unreg > 1 ? "s" : ""} to an unregistered name`); score += 2; }
    const cnt = S.data.counts.filter(c => c.materialId === m.id).sort(by("date")).pop(); let shrink = null;
    if (cnt && num(cnt.bookQty)){ shrink = num(cnt.counted) - num(cnt.bookQty); if (shrink < 0 && -shrink / num(cnt.bookQty) > .02){ flags.push(`Physical count ${fmtD(cnt.date)} short by ${fmtN(-shrink)} ${m.unit || ""} (${Math.round(-shrink / num(cnt.bookQty) * 100)}%)`); score += 3; } }

/* ---------- who a payment or a person belongs to ---------- */
const GREY_CATS = ["Steel", "Cement", "Blocks", "Sand & crush", "Ready-mix", "Waterproofing", "Termite"];
function partnerGroup(pid){
  const p = get("parties", pid); if (!p) return "other";
  const ty = String(p.ptype || p.type || "") + " " + String(p.scope || "");
  const st = (SITE().ptypes.find(x => x.name === p.ptype) || {});
  if (/builder|contractor/i.test(ty) && !/sub-contractor|finishing/i.test(ty)) return "builder";
  if (/architect|design|engineer|consultant|mep|testing|surveyor|lab/i.test(ty) || st.stage === "Design") return "design";
  if (/finishing|interior|landscap|pool/i.test(ty) || st.stage === "Finishing") return "finishing";
  if (/grey|structure|supplier|sub-contractor/i.test(ty) || st.stage === "Grey") return "grey";
  return "other";
}
const PG = [["builder", "Builder", "var(--k1)"], ["grey", "Grey suppliers", "var(--k3)"], ["finishing", "Finishing suppliers", "var(--k6)"], ["design", "Design partners", "var(--k5)"], ["other", "Other", "var(--k7)"]];
function partnerMoney(){
  const out = {}; PG.forEach(([k]) => { out[k] = {paid: 0, due: 0}; });
  const net = p => num(p.amount) - num(p.adjustment);
  S.data.payments.forEach(p => { const g = partnerGroup(p.partyId); if (p.status === "Paid") out[g].paid += net(p); else out[g].due += net(p); });
  S.data.pos.forEach(o => { const v = num(o.qty) * num(o.unitPrice); if (!v) return; const sup = get("suppliers", o.supplierId) || {}; const g = o.partyId ? partnerGroup(o.partyId) : GREY_CATS.includes(sup.category) ? "grey" : "finishing"; if (o.payStatus === "Paid") out[g].paid += v; else if (!["Cancelled"].includes(o.status)) out[g].due += v; });
  return out;
}
function paidPartnersTile(){
  const m = partnerMoney(); const paid = sum(PG, ([k]) => m[k].paid), due = sum(PG, ([k]) => m[k].due);
  const own = !is("owner"); const rows = PG.filter(([k]) => k !== "other" || m.other.paid);

}

/* ---------- people on site, by partner ---------- */
function personPartner(p){

  if (p.supplierId) return ["sup:" + p.supplierId, supplierName(p.supplierId) || "Supplier"];

}

const NCR_DAYS = 7;
actionItems = function(){
  const a = []; const T = today();
  // labour
  committedLabour().forEach(c => { const n = (onsiteByPartner().find(x => x.k === c.k) || {n: 0}).n; if (n < c.c) a.push({g: "Labour", k: n < c.c / 2 ? "bad" : "warn", t: `${c.l}: ${n} on site today, ${c.c} committed (${c.c - n} short)`, go: ["attendance"]}); });
  S.data.attendance.filter(x => x.date === T && x.in).forEach(x => { const p = get("people", x.personId);
    if (!p || p.status !== "Active") a.push({g: "Labour", k: "bad", t: `${p ? p.name : "Unknown person"} is on site but not an active registered worker`, go: ["people"]});
    else if ((p.btkExpiry && p.btkExpiry < T) || (p.cnicExpiry && p.cnicExpiry < T)) a.push({g: "Labour", k: "bad", t: `${p.name} is on site with an expired ${p.btkExpiry && p.btkExpiry < T ? "BTK card" : "CNIC"}`, go: ["people"]});

  if (is("owner", "ownerSup", "siteSup")) S.data.people.filter(p => p.status === "Pending").slice(0, 5).forEach(p => a.push({g: "Labour", k: "warn", t: `${p.name}: registration waiting for verification`, go: ["people"]}));
  // commitments vs actual
  stagesSorted().forEach(s => { const pl = stagePlanned(s), b = stageEff(s); if (pl - b > 5) a.push({g: "Commitments", k: pl - b > 20 ? "bad" : "warn", t: `${s.name}: built ${Math.round(b)}% against ${Math.round(pl)}% planned by today`, go: ["progress"]}); });
  if (canVerify()) stagesSorted().filter(pendingVerify).forEach(s => a.push({g: "Commitments", k: "warn", t: `Verify ${s.name}: reported ${Math.round(stageRep(s))}%, verified ${Math.round(stageEff(s))}%`, go: ["progress"]}));

  return `<svg class="spk" viewBox="0 0 ${days.length * (w + g)} 26" aria-hidden="true">${out.map((v, i) => v ? `<rect x="${i * (w + g)}" y="${26 - v / mx * 22}" width="${w}" height="${v / mx * 22}" rx="1.5" style="fill:var(--k3)"/>` : `<rect x="${i * (w + g)}" y="24" width="${w}" height="2" rx="1" style="fill:var(--line)"/>`).join("")}${inn.map((v, i) => v ? `<circle cx="${i * (w + g) + w / 2}" cy="${26 - v / mx * 22}" r="2.6" style="fill:var(--k1);stroke:var(--panel);stroke-width:1"/>` : "").join("")}</svg>`;
}

/* ---------- v16: procurement with multi-line RFQs and quotations, discounts and revisions ---------- */
// RFQ: header + lines (item, qty, unit, spec). Quotation: a rate and discount per line, overall discount,
// sales tax and freight, and numbered revisions so every price change is tracked. Award per line or whole.
const rfqLines = r => r.lines && r.lines.length ? r.lines : (r.materialId || r.description ? [{materialId: r.materialId || "", desc: r.description || "", qty: num(r.qty), unit: poUnit(r), spec: r.spec || ""}] : []);
const lineName = l => l.materialId ? matName(l.materialId) : (l.desc || "Item");
function quoteCalc(q, r){
  const L = rfqLines(r); const ql = q.lines || (L.length === 1 && q.unitPrice ? [{rate: num(q.unitPrice)}] : []);
  const lines = L.map((l, i) => { const x = ql[i] || {}; const gross = num(l.qty) * num(x.rate); const net = gross * (1 - num(x.discPct) / 100); return {qty: num(l.qty), rate: num(x.rate), discPct: num(x.discPct), gross, net, unitNet: num(l.qty) ? net / num(l.qty) : 0, quoted: x.rate != null && x.rate !== "" && num(x.rate) > 0, brand: x.brand || "", remark: x.remark || ""}; });
  const sub = sum(lines, x => x.net); const hd = num(q.discAmt) || sub * num(q.discPct) / 100; const after = sub - hd; const tax = after * num(q.taxPct) / 100; const total = after + tax + num(q.freight);
  const factor = sub ? after / sub : 1;   // header discount spread over the lines for the PO rate
  lines.forEach(x => { x.final = x.qty ? x.net * factor * (1 + num(q.taxPct) / 100) / x.qty : 0; });
  return {lines, sub, hd, tax, total, quotedAll: lines.every(x => x.quoted), quotedN: lines.filter(x => x.quoted).length};
}

  };
  draw();
}

/* ---------- quotation editor with revisions ---------- */

  const draw = () => {
    r = get("rfqs", q.rfqId); const L = r ? rfqLines(r) : []; q.lines = L.map((l, i) => Object.assign({rate: "", discPct: "", brand: "", remark: ""}, (q.lines || [])[i] || (L.length === 1 && q.unitPrice && i === 0 ? {rate: q.unitPrice} : {})));
    const c = r ? quoteCalc(q, r) : {lines: [], sub: 0, hd: 0, tax: 0, total: 0};

      <div class="fld"><label for="qtS">${esc(t("Vendor"))} *</label><select id="qtS" ${S.role === "supplier" || !isNew ? "disabled" : ""}><option value="">—</option>${S.data.suppliers.filter(s => !r || !(r.supplierIds || []).length || r.supplierIds.includes(s.id) || s.id === q.supplierId).map(s => `<option value="${s.id}" ${s.id === q.supplierId ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div class="fld"><label for="qtRef">${esc(t("Vendor's quotation no."))}</label><input id="qtRef" value="${esc(q.ref || "")}"></div>
      <div class="fld"><label for="qtDate">${esc(t("Quotation date"))}</label><input id="qtDate" type="date" value="${esc(q.date || today())}"></div>
    </div>
    ${r ? `<div class="tbl" style="margin-top:10px"><table class="lines"><thead><tr><th>#</th><th>${esc(t("Item"))}</th><th class="r">${esc(t("Qty"))}</th><th class="r">${esc(t("Rate (Rs)"))}</th><th class="r">${esc(t("Disc %"))}</th><th class="r">${esc(t("Amount"))}</th><th>${esc(t("Brand / remark"))}</th></tr></thead><tbody>${L.map((l, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(lineName(l))}</b><div class="small muted">${esc(l.spec || "")}</div></td><td class="r num">${fmtN(l.qty)} ${esc(l.unit || "")}</td>
      <td class="r"><input data-ql="${i}:rate" type="number" min="0" value="${esc(q.lines[i].rate)}" style="width:100px"></td><td class="r"><input data-ql="${i}:discPct" type="number" min="0" max="100" value="${esc(q.lines[i].discPct)}" style="width:64px"></td>
      <td class="r num" id="qa${i}">${rs(c.lines[i].net)}${c.lines[i].discPct ? `<div class="small muted">${esc(t("was"))} ${rs(c.lines[i].gross)}</div>` : ""}</td><td><input data-ql="${i}:brand" value="${esc(q.lines[i].brand)}" placeholder="${esc(t("brand"))}"></td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="5" class="r">${esc(t("Subtotal after line discounts"))}</td><td class="r num" id="qaSub"><b>${rs(c.sub)}</b></td><td></td></tr>
      <tr><td colspan="5" class="r">${esc(t("Overall discount"))} <input id="qtDp" type="number" min="0" max="100" value="${esc(q.discPct || "")}" style="width:64px" aria-label="Overall discount %"> % ${esc(t("or"))} Rs <input id="qtDa" type="number" min="0" value="${esc(q.discAmt || "")}" style="width:100px" aria-label="Overall discount amount"></td><td class="r num" id="qaHd">− ${rs(c.hd)}</td><td></td></tr>
      <tr><td colspan="5" class="r">${esc(t("Sales tax (GST)"))} <input id="qtTx" type="number" min="0" value="${esc(q.taxPct || "")}" style="width:64px" aria-label="Sales tax %"> %</td><td class="r num" id="qaTax">+ ${rs(c.tax)}</td><td></td></tr>
      <tr><td colspan="5" class="r">${esc(t("Transport / unloading"))}</td><td class="r"><input id="qtFr" type="number" min="0" value="${esc(q.freight || "")}" style="width:100px" aria-label="Freight"></td><td></td></tr>
      <tr class="tot"><td colspan="5" class="r"><b>${esc(t("Quotation total"))}</b></td><td class="r num" id="qaTot"><b>${rs(c.total)}</b></td><td></td></tr></tfoot></table></div>` : `<div class="empty small">${esc(t("Choose the RFQ first."))}</div>`}
    <div class="form" style="margin-top:10px"><div class="fld"><label for="qtDd">${esc(t("Delivery (days)"))}</label><input id="qtDd" type="number" value="${esc(q.deliveryDays || "")}"></div><div class="fld"><label for="qtVal">${esc(t("Valid until"))}</label><input id="qtVal" type="date" value="${esc(q.validity || "")}"></div>

      <div class="fld full"><label for="qtTerms">${esc(t("Other terms"))}</label><textarea id="qtTerms">${esc(q.terms || "")}</textarea></div>
      ${!isNew ? `<div class="fld full"><label for="qtWhy">${esc(t("Reason for this revision (required when prices change)"))}</label><input id="qtWhy" placeholder="${esc(t("e.g. 3% line discount on steel after negotiation"))}"></div>` : ""}</div>
    </fieldset>
    ${revs.length ? `<h3 class="h3" style="margin-top:12px">${esc(t("Revision history"))}</h3><div class="tbl"><table><thead><tr><th>${esc(t("Revision"))}</th><th>${esc(t("Date"))}</th><th class="r">${esc(t("Total"))}</th><th class="r">${esc(t("Change"))}</th><th>${esc(t("Reason"))}</th></tr></thead><tbody>
      <tr><td><b>${esc(t("Rev"))} ${q.rev}</b> (${esc(t("current"))})</td><td>${fmtD((q.revAt || q.updatedAt || "").slice(0, 10))}</td><td class="r num"><b>${rs(c.total)}</b></td><td class="r num">${revs[0] ? deltaHtml(c.total - num(revs[0].total)) : ""}</td><td class="small">${esc(q.revNote || "")}</td></tr>
      ${revs.map((v, i) => `<tr><td>${esc(t("Rev"))} ${v.rev}</td><td>${fmtD(String(v.at || "").slice(0, 10))}</td><td class="r num">${rs(v.total)}</td><td class="r num">${revs[i + 1] ? deltaHtml(num(v.total) - num(revs[i + 1].total)) : ""}</td><td class="small">${esc(v.note || "")}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>
    <footer><span class="small muted" style="margin-right:auto">${r ? `${c.quotedN} ${esc(t("of"))} ${c.lines.length} ${esc(t("items priced"))}` : ""}</span><button class="btn" data-close="1">${esc(t("Close"))}</button>${ed ? `<button class="btn pri" id="qtSave">${esc(t(isNew ? "Save quotation" : "Save as new revision"))}</button>` : ""}</footer></div></div>`;
    const root = $("#scrim"); root.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);

      Object.assign(q, {ref: v("qtRef") || "", date: v("qtDate") || "", discPct: v("qtDp") === "" ? "" : num(v("qtDp")), discAmt: v("qtDa") === "" ? "" : num(v("qtDa")), taxPct: v("qtTx") === "" ? "" : num(v("qtTx")), freight: v("qtFr") === "" ? "" : num(v("qtFr")), deliveryDays: v("qtDd") || "", validity: v("qtVal") || "", payTerms: v("qtPay") || "", terms: v("qtTerms") || "", status: S.role === "supplier" ? q.status : (v("qtStt") || q.status)});
      root.querySelectorAll("[data-ql]").forEach(el => { const [i, k] = el.dataset.ql.split(":"); q.lines[+i][k] = ["rate", "discPct"].includes(k) ? (el.value === "" ? "" : num(el.value)) : el.value; }); };

        if (changed){ if (!why){ toast("Write the reason for this revision."); return; } q.revisions = (old.revisions || []).concat([{rev: num(old.rev), at: old.revAt || old.updatedAt || new Date().toISOString(), by: old.revBy || old.createdBy || "", total: oc.total, lines: old.lines || [], discPct: old.discPct || "", discAmt: old.discAmt || "", taxPct: old.taxPct || "", freight: old.freight || "", note: old.revNote || (num(old.rev) ? "" : "Original quotation")}]); q.rev = num(old.rev) + 1; q.revNote = why; q.revAt = new Date().toISOString(); q.revBy = S.myId; if (q.status === "Submitted") q.status = "Under negotiation"; } }

const deltaHtml = d => Math.abs(d) < 0.5 ? "—" : `<span style="color:${d < 0 ? "var(--good)" : "var(--bad)"}">${d < 0 ? "−" : "+"}${rs(Math.abs(d))}</span>`;

/* ---------- comparison and award ---------- */
openCompare = function(rid){
  const r = get("rfqs", rid); if (!r) return; const L = rfqLines(r); const qs = latestQuotes(rid);
  const C = qs.map(q => ({q, c: quoteCalc(q, r)})).sort((a, b) => a.c.total - b.c.total);
  const best = L.map((l, i) => { const v = C.filter(x => x.c.lines[i] && x.c.lines[i].quoted); return v.length ? v.reduce((a, b) => a.c.lines[i].final <= b.c.lines[i].final ? a : b).q.id : null; });
  const canAward = is("owner") || is("sb") || approveFor("quotes"); const pick = L.map((l, i) => best[i]);
  const draw = () => {
    $("#modalRoot").innerHTML = `<div class="scrim" id="scrim"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="cmT"><header><h2 id="cmT">${esc(t("Compare quotations"))}: ${esc(r.no || "")} ${esc(r.title || "")}</h2><button class="btn sm" data-close="1" aria-label="Close">✕</button></header>
    <div class="body">${C.length ? `<div class="tbl"><table class="qcmp"><thead><tr><th>${esc(t("Item"))}</th><th class="r">${esc(t("Qty"))}</th>${C.map(x => `<th class="r">${esc(supplierName(x.q.supplierId))}<div class="small muted">${esc(t("Rev"))} ${num(x.q.rev)} · ${esc(t(x.q.status))}</div></th>`).join("")}</tr></thead><tbody>
      ${L.map((l, i) => `<tr><td><b>${esc(lineName(l))}</b><div class="small muted">${esc(l.spec || "")}</div></td><td class="r num">${fmtN(l.qty)} ${esc(l.unit || "")}</td>${C.map(x => { const z = x.c.lines[i]; const isBest = best[i] === x.q.id; return `<td class="r num ${isBest ? "best" : ""}">${z && z.quoted ? `${rs(z.final)}<div class="small muted">${rs(z.final * z.qty)}${z.discPct ? ` · −${z.discPct}%` : ""}${z.brand ? " · " + esc(z.brand) : ""}</div>${canAward ? `<label class="small"><input type="radio" name="aw${i}" value="${x.q.id}" ${pick[i] === x.q.id ? "checked" : ""}> ${esc(t("award"))}</label>` : ""}` : `<span class="muted">${esc(t("not quoted"))}</span>`}</td>`; }).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="2">${esc(t("Overall discount"))}</td>${C.map(x => `<td class="r num">${x.c.hd ? "− " + rs(x.c.hd) : "—"}</td>`).join("")}</tr><tr><td colspan="2">${esc(t("Sales tax + transport"))}</td>${C.map(x => `<td class="r num">${rs(x.c.tax + num(x.q.freight))}</td>`).join("")}</tr>
      <tr class="tot"><td colspan="2"><b>${esc(t("Total"))}</b></td>${C.map((x, k) => `<td class="r num ${k === 0 && x.c.quotedAll ? "best" : ""}"><b>${rs(x.c.total)}</b>${x.c.quotedAll ? "" : `<div class="small" style="color:var(--warn)">${x.c.quotedN}/${L.length} ${esc(t("items"))}</div>`}</td>`).join("")}</tr>
      <tr><td colspan="2">${esc(t("Delivery · payment"))}</td>${C.map(x => `<td class="r small">${x.q.deliveryDays ? x.q.deliveryDays + " d" : "—"}${x.q.payTerms ? " · " + esc(x.q.payTerms) : ""}</td>`).join("")}</tr>
      <tr><td colspan="2">${esc(t("Revisions"))}</td>${C.map(x => `<td class="r small">${(x.q.revisions || []).length ? `${(x.q.revisions || []).length} · ${esc(t("from"))} ${rs((x.q.revisions[0] || {}).total)}` : "—"}</td>`).join("")}</tr></tfoot></table></div>
      <p class="small muted">${esc(t("Green = lowest landed rate for the item (after line and overall discounts and tax). Award each item to one vendor; a purchase order is raised per item for the owner's approval."))}</p>` : `<div class="empty"><b>${esc(t("No quotations yet"))}</b></div>`}</div>
    <footer><span class="spacer"></span><button class="btn" data-close="1">${esc(t("Close"))}</button>${canAward && C.length && r.status !== "Awarded" ? `<button class="btn" id="cmAll">${esc(t("Award all to the lowest total"))}</button><button class="btn pri" id="cmGo">${esc(t("Award selected items"))}</button>` : ""}</footer></div></div>`;
    const root = $("#scrim"); root.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);

  const side = (a, k) => a[k] ? `<div class="af-s">${a[k + "Photo"] ? `<img src="${a[k + "Photo"]}" alt="" data-zoom="${esc(a[k + "Photo"])}">` : `<span class="af-np">${esc(t("no photo"))}</span>`}<div><b><bdi>${esc(a[k])}</bdi></b> ${pill(t(a[k + "Status"] || "—"), ["Verified", "Approved"].includes(a[k + "Status"]) ? "good" : a[k + "Status"] === "Flagged" ? "warn" : a[k + "Status"] === "Rejected" ? "bad" : "")}<div>${loc(a, k)}${a[k + "Badge"] ? ` · ${esc(t("badge"))}` : ""}${a[k + "ByName"] ? ` · ${esc(t("by"))} ${esc(a[k + "ByName"])}` : ""}</div></div></div>` : `<span class="small muted">${esc(t(k === "out" ? "not checked out" : "—"))}</span>`;

function resolveRole(){
  if (S.isOwner){ S.realRole = "owner"; if (!S.role) S.role = "owner"; return; }
  const m = S.myId && (get("members", S.myId) || (window.SO && SO.portalFor(SO.role) ? {role: SO.portalFor(SO.role)} : null));
  const pr = S.myId && S.data.people.find(p => p.userId === S.myId);
  const ok = m && !m.disabled && !(pr && pr.status === "Blocked");
  S.realRole = ok ? m.role : null; S.role = S.realRole; S.mySupplier = ok ? m.supplierId || null : null;
}
function showNoAccess(){
  $("#nav").innerHTML = ""; $("#bottombar").innerHTML = ""; $("#who").innerHTML = ""; $("#title").textContent = "Villa 31 Site Office";
  $("#content").innerHTML = `<div class="empty"><b>You don't have a portal yet</b>The owner gives each person their portal (Owner's Supervisor, Builder, Store Keeper, Site Supervisor or Supplier) from People & access. Ask the owner to add you, then reload this page.<br><br><button class="btn" data-so="out">Sign out</button></div>`;
}
async function boot(){
  const c = window.claude;
  const [db, user, sample] = c && c.use ? await Promise.all([c.use("db"), c.use("user"), c.use("sample")]) : [null, null, null];
  S.db = db; S.user = user; S.sample = sample;
  if (sample && sample.limits){ try { const lim = await sample.limits(); S.imgMax = lim && lim.images ? lim.images.maxCount : 0; } catch(e){ S.imgMax = 1; } }
  if (user){ S.isOwner = await user.isOwner(); S.myId = await user.id(); try { S.myName = await user.name(); } catch(e){} }
  await initDevice();
  if (!db){
    S.offline = true; S.isOwner = true; S.role = "owner"; S.realRole = "owner";
    S.data.config = [{id: "project", name: "Villa 31", coveredArea: 6500, contractor: "Syed Brothers (Pvt.) Ltd."}];
    render(); return;
  }
  let first = true;
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      S.data[col] = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      S.loaded.add(col);
      if (S.loaded.size === COLS.length){
        const prev = S.role; resolveRole(); if (!S.isOwner && prev && S.realRole !== prev) S.role = S.realRole;
        if (!S.role){ showNoAccess(); return; }
        if (first){ first = false; writeAudit(); }
        if (!modalState) render(); else { renderNav(); }
      }
    }, err => { if (err.code === "revoked"){ $("#content").innerHTML = `<div class="empty"><b>Access to the project records ended</b>Reload the page to continue.</div>`; } });
  });
}
boot();
})();
</script>
