<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<meta name="robots" content="noindex">
<title>Plan & billing · Mabni</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Kufi+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">

<style>
/* Layout: a blueprint header band with the plan's state, then plan choice, how to pay, the payment form and history in one column */
:root{
  --blue:#1E3A5F; --blue-2:#284B78; --amber:#F2B01E; --ink:#14202B; --muted:#5B6875; --bg:#EEF1F4; --card:#FFFFFF; --line:#D5DBE1; --field:#F7F9FA;
  --ok:#1C7148; --warn:#9A6500; --bad:#B3402A; --on-blue:#E9F0F8; --on-blue-2:#B9CBE0;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif; --ar:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--ink:#E6EBF0; --muted:#9EABB8; --bg:#0F151C; --card:#17202A; --line:#2B3744; --field:#121A22; --ok:#5FD198; --warn:#F0B33A; --bad:#F08A72; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body)}
html[lang=ar] body{font-family:var(--ar)}
html[lang=ur] body{font-family:var(--ur);line-height:2.05}
.num,.mono{font-family:var(--mono)}
.band{background:var(--blue);color:var(--on-blue);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;opacity:.14;pointer-events:none;background-image:linear-gradient(var(--on-blue-2) 1px,transparent 1px),linear-gradient(90deg,var(--on-blue-2) 1px,transparent 1px);background-size:28px 28px}
.in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font:800 1.3rem/1 var(--display)}
.logo span{color:var(--on-blue-2);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{color:var(--on-blue);text-decoration:none;font-size:.9rem;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
.status{position:relative;padding-block:18px 30px;display:grid;gap:8px}
.status .eyebrow{font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
html[lang=ur] .status .eyebrow,html[lang=ar] .status .eyebrow{letter-spacing:0;font-family:inherit;font-size:.9rem}
.status h1{margin:0;color:#fff;font:800 clamp(1.7rem,4vw,2.5rem)/1.1 var(--display);text-wrap:balance}
html[lang=ur] .status h1{font:600 clamp(1.5rem,3.4vw,2.1rem)/1.9 var(--ur)} html[lang=ar] .status h1{font:700 clamp(1.5rem,3.4vw,2.1rem)/1.45 var(--ar)}
.status p{margin:0;color:var(--on-blue-2);max-width:60ch}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;max-width:420px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px}
main.in{display:grid;gap:22px;padding-block:22px 56px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
h2{margin:0;font:750 1.2rem/1.2 var(--display)}
html[lang=ur] h2{font:600 1.15rem/1.9 var(--ur)} html[lang=ar] h2{font:700 1.15rem/1.5 var(--ar)}
.lede{margin:0;color:var(--muted)}
.period{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;justify-self:start}
.period button{border:0;background:transparent;color:var(--ink);font:500 .9rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
html[lang=ur] .period button{font-family:var(--ur)} html[lang=ar] .period button{font-family:var(--ar)}
.period button[aria-pressed=true]{background:var(--blue);color:#fff}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.plan{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;cursor:pointer;background:var(--field);position:relative}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan:has(input:checked){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,var(--card))}
.plan:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.plan b{font:750 1.1rem/1.2 var(--display)}
.plan .price{font:600 1.35rem/1.2 var(--mono)}
.plan .usd{font:500 .82rem var(--mono);color:var(--muted)}
.plan ul{margin:0;padding-inline-start:1.1rem;font-size:.9rem;color:var(--muted);display:grid;gap:2px}
.plan .now{position:absolute;top:-10px;inset-inline-end:12px;background:var(--blue);color:#fff;font:600 .7rem/1 var(--body);padding:5px 8px;border-radius:99px}
.save{font:600 .75rem/1 var(--body);color:var(--ok);margin-inline-start:4px}
.period button[aria-pressed=true] .save{color:var(--amber)}
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.bank{border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:.92rem;min-width:0}
.bank b{font:700 1rem/1.3 var(--display)}
.bank .kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.bank .kv span{color:var(--muted);font-size:.82rem}
.bank .kv code{font:500 .9rem var(--mono);overflow-wrap:anywhere;direction:ltr;text-align:start}
.copy{border:0;background:transparent;color:var(--blue-2);font:600 .78rem var(--body);cursor:pointer;padding:4px}
@media (prefers-color-scheme: dark){.copy{color:var(--amber)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.f{display:grid;gap:6px;min-width:0}
.f label{font-weight:600;font-size:.92rem}
.f .help{font-size:.82rem;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
.amount{display:flex;gap:8px}
.amount select{width:auto;flex:none}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:12px;background:var(--amber);color:#1B1405;font:700 1rem/1 var(--display);padding:15px 18px;cursor:pointer;min-height:50px}
html[lang=ur] .btn{font:600 1rem/1.6 var(--ur)} html[lang=ar] .btn{font:700 1rem/1.4 var(--ar)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn:focus-visible,.period button:focus-visible,.copy:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.msg{border-radius:10px;padding:10px 12px;font-size:.93rem}
.msg.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));color:var(--ok)}
.hist{display:grid;gap:8px}
.pay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;border-bottom:1px solid var(--line);padding-block:8px}
.pay:last-child{border-bottom:0}
.pay small{color:var(--muted)}
.pill{font:600 .75rem/1 var(--body);padding:5px 8px;border-radius:99px;align-self:start;white-space:nowrap}
.pill.w{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.pill.v{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.pill.r{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.skel{color:var(--muted)}
.help-line{font-size:.9rem;color:var(--muted)}
.help-line b{color:var(--ink);font-family:var(--mono);direction:ltr;unicode-bidi:embed}
</style>
</head>
<body>
<header class="band">
  <div class="in top">
    <a class="logo" href="/field">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#fff" fill-opacity=".1"/><rect x="24" y="30" width="15" height="60" rx="3" fill="#fff"/><rect x="81" y="30" width="15" height="60" rx="3" fill="#fff"/><polyline points="39,52 55,70 81,34" fill="none" stroke="#F2B01E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Mabni</b><span id="co"></span>
    </a>
    <nav class="links"><a href="/field" id="back" data-t="back"></a><a href="/api/method/logout?redirect-to=/login" data-t="signout"></a></nav>
  </div>
  <div class="in status">
    <div class="eyebrow" id="st-eyebrow"></div>
    <h1 id="st-title"></h1>
    <p id="st-text"></p>
    <div class="meter" id="st-meter" hidden><i></i></div>
  </div>
</header>

<main class="in" id="main">
  <section class="card" id="not-owner" hidden><h2 data-t="owner_only_t"></h2><p class="lede" data-t="owner_only"></p></section>

  <section class="card" id="sec-plan" hidden>
    <h2 data-t="choose"></h2>
    <div class="period" role="group"><button type="button" data-p="Monthly" data-t="monthly"></button><button type="button" data-p="Yearly"><span data-t="yearly"></span><span class="save" data-t="save"></span></button></div>
    <div class="plans" id="plans"></div>
  </section>

  <section class="card" id="sec-banks" hidden>
    <h2 data-t="how_t"></h2>
    <p class="lede" id="how-d"></p>
    <div class="banks" id="banks"></div>
  </section>

  <section class="card" id="sec-form" hidden>
    <h2 data-t="tell_t"></h2>
    <p class="lede" data-t="tell_d"></p>
    <form id="pay" class="grid2" novalidate>
      <div class="f"><label for="amount" data-t="amount"></label><div class="amount"><select id="currency"></select><input id="amount" type="text" inputmode="decimal" dir="ltr"></div></div>
      <div class="f"><label for="paid_on" data-t="paid_on"></label><input id="paid_on" type="date" dir="ltr"></div>
      <div class="f"><label for="paid_to" data-t="paid_to"></label><select id="paid_to"></select></div>
      <div class="f"><label for="reference" data-t="reference"></label><input id="reference" type="text" maxlength="140" dir="ltr"></div>
      <div class="f" style="grid-column:1/-1"><label for="proof" data-t="proof"></label>
        <div class="photo"><input id="proof" type="file" accept="image/*" style="max-width:320px"><img id="proof-img" alt="" hidden></div>
        <div class="help" data-t="proof_help"></div></div>
      <div class="f" style="grid-column:1/-1"><label for="note" data-t="note"></label><textarea id="note" rows="2" maxlength="900"></textarea></div>
      <div id="pay-msg" class="msg" hidden style="grid-column:1/-1"></div>
      <div style="grid-column:1/-1"><button class="btn" type="submit" id="pay-go" data-t="send"></button></div>
    </form>
  </section>

  <section class="card" id="sec-hist" hidden>
    <h2 data-t="hist_t"></h2>
    <div class="hist" id="hist"></div>
  </section>

  <p class="help-line" id="support"></p>
  <p class="skel" id="loading" data-t="loading"></p>
</main>

    owner_only_t: "الدفع للمالك فقط", owner_only: "اطلب من مالك مساحة العمل فتح صفحة الباقة والدفع.",
    choose: "اختر باقتك", monthly: "شهري", yearly: "سنوي", save: "شهران مجاناً", per_m: "شهرياً", per_y: "سنوياً", current: "باقتك الحالية",
    projects: "{n} مشاريع", project1: "مشروع واحد", users: "{n} مستخدمين", storage: "{n} جيجابايت للصور والملفات",
    how_t: "الدفع بالتحويل البنكي", how_d: "حوّل {amt} إلى أحد هذه الحسابات، واكتب اسم مساحة عملك “{ws}” في ملاحظة التحويل.",
    no_banks: "سنرسل بيانات الحساب البنكي بالبريد. يرجى التواصل معنا.",
    k_title: "اسم الحساب", k_no: "رقم الحساب", k_iban: "الآيبان", k_swift: "سويفت", k_branch: "الفرع", copy: "نسخ", copied: "تم النسخ",
    tell_t: "أخبرنا أنك دفعت", tell_d: "نراجع كل تحويل يدوياً، عادة خلال يوم عمل، ونراسلك عند تفعيل باقتك.",
    amount: "المبلغ المدفوع", paid_on: "تاريخ الدفع", paid_to: "الحساب المحوَّل إليه", reference: "رقم العملية", proof: "صورة الإيصال أو لقطة الشاشة",
    proof_help: "من تطبيق البنك أو إيصال الفرع.", note: "ملاحظة (اختياري)", send: "إرسال للمراجعة",
    e_amount: "أدخل المبلغ المدفوع.", e_ref: "أدخل رقم العملية أو أرفق صورة الإيصال.",
    sent_ok: "شكراً لك. سنراجع الدفعة ونراسلك عند تفعيل باقتك.",
    hist_t: "دفعاتك", h_w: "قيد المراجعة", h_v: "مؤكدة", h_r: "غير مؤكدة", covers: "من {a} إلى {b}",
    support: "لديك سؤال؟ راسلنا على {e} أو واتساب {w}.", support_e: "لديك سؤال؟ راسلنا على {e}.", e_load: "تعذّر تحميل اشتراكك. حاول مجدداً بعد قليل.",
  },
};
const L = CFG.lang;
const PLAN_NAME = { Owner: { ur: "مالک", ar: "المالك" }, Builder: { ur: "بلڈر", ar: "المقاول" } };
const pn = (n) => (PLAN_NAME[n] && PLAN_NAME[n][L]) || n;
const t = (k, v) => { let s = (I18N[L] && I18N[L][k]) || I18N.en[k] || k; for (const x in v || {}) s = s.split("{" + x + "}").join(v[x]); return s; };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtDate = (d) => { if (!d) return ""; const x = new Date(d + "T00:00:00"); return x.toLocaleDateString(L === "en" ? "en-GB" : L === "ur" ? "ur-PK" : "ar-SA-u-nu-latn-ca-gregory", { day: "numeric", month: "short", year: "numeric" }); };
const num = (v) => Number(v || 0).toLocaleString("en", { maximumFractionDigits: 2 });
document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
$("co").textContent = CFG.company ? "· " + CFG.company : "";
let ACC = null, PERIOD = "Monthly", PLAN = null;

function header(st) {
  const s = st || CFG.state || {};
  let eb = "", title = "", text = "", pct = null;
  if (s.status === "Trial") {
    eb = t("s_trial"); title = s.days_left > 0 ? t("t_trial", { n: s.days_left }) : t("t_trial0"); text = t("d_trial", { d: fmtDate(s.trial_ends) });
    pct = Math.max(4, Math.min(100, 100 - (s.days_left / 7) * 100));
  } else if (s.status === "Active") { eb = t("s_active"); title = t("t_active", { plan: pn(s.plan || ""), d: fmtDate(s.paid_until) }); text = t("d_active"); }
  else if (s.status === "Payment due") { eb = t("s_due"); title = t("t_due", { what: t(s.paid_until ? "w_plan" : "w_trial"), d: fmtDate(s.paid_until || s.trial_ends) }); text = t("d_due", { n: s.grace_left == null ? "" : s.grace_left }); }
  else if (s.status === "Cancelled") { eb = t("s_cancel"); title = t("t_paused"); text = t("d_paused"); }
  else { eb = t("s_paused"); title = t("t_paused"); text = t("d_paused"); }
  $("st-eyebrow").textContent = eb; $("st-title").textContent = title; $("st-text").textContent = text;
  if (pct != null) { $("st-meter").hidden = false; $("st-meter").firstElementChild.style.width = pct + "%"; }
  $("back").hidden = !!s.blocked;
}
header();

function price(p) { return PERIOD === "Yearly" ? p.year : p.month; }
function fmtPrice(pr) { return pr.currency === "USD" ? "$" + num(pr.amount) : pr.currency + " " + num(pr.amount); }
function plans() {
  document.querySelectorAll(".period button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === PERIOD));
  const box = $("plans"); box.innerHTML = "";
  ACC.plans.forEach((p) => {
    const pr = price(p);
    const lab = document.createElement("label"); lab.className = "plan";
    const sum = (p.summary && (p.summary[L] || p.summary.en)) || "";
    lab.innerHTML = `<input type="radio" name="plan" value="${esc(p.name)}" ${p.name === PLAN ? "checked" : ""}>
      ${p.name === ACC.plan && ACC.status === "Active" ? `<span class="now">${esc(t("current"))}</span>` : ""}
      <b>${esc(pn(p.name))}</b><span class="price">${esc(fmtPrice(pr))} <small class="usd">${esc(t(PERIOD === "Yearly" ? "per_y" : "per_m"))}</small></span>
      ${pr.currency !== "USD" ? `<span class="usd">$${num(pr.usd)}</span>` : ""}
      ${sum ? `<span class="lede" style="font-size:.9rem">${esc(sum)}</span>` : ""}
      <ul><li>${esc(p.max_projects === 1 ? t("project1") : t("projects", { n: p.max_projects }))}</li><li>${esc(t("users", { n: p.max_users }))}</li><li>${esc(t("storage", { n: p.storage_gb }))}</li></ul>`;
    lab.querySelector("input").addEventListener("change", () => { PLAN = p.name; howMuch(); });
    box.appendChild(lab);
  });
  howMuch();
}
document.querySelectorAll(".period button").forEach((b) => b.addEventListener("click", () => { PERIOD = b.dataset.p; plans(); }));

function howMuch() {
  const p = ACC.plans.find((x) => x.name === PLAN) || ACC.plans[0];
  if (!p) return;
  const pr = price(p);
  $("how-d").textContent = t("how_d", { amt: fmtPrice(pr), ws: ACC.tenant });
  const cur = $("currency");
  const curs = [...new Set([pr.currency, "USD"])];
  cur.innerHTML = curs.map((c) => `<option>${c}</option>`).join("");
  $("amount").value = pr.amount;
  cur.onchange = () => { $("amount").value = cur.value === pr.currency ? pr.amount : pr.usd; };
}

function banks() {
  const box = $("banks"), sel = $("paid_to");
  sel.innerHTML = "";
  if (!ACC.banks.length) { box.innerHTML = `<p class="lede">${esc(t("no_banks"))}</p>`; sel.innerHTML = "<option value=''>-</option>"; return; }
  box.innerHTML = "";
  ACC.banks.forEach((b) => {
    const rows = [["k_title", b.account_title], ["k_no", b.account_number], ["k_iban", b.iban], ["k_swift", b.swift], ["k_branch", b.branch]].filter((r) => r[1]);
    const el = document.createElement("div"); el.className = "bank";
    el.innerHTML = `<b>${esc(b.bank_name)} · ${esc(b.currency)}</b><div class="kv">${rows.map((r) => `<span>${esc(t(r[0]))}</span><code>${esc(r[1])}</code><button type="button" class="copy" data-v="${esc(r[1])}">${esc(t("copy"))}</button>`).join("")}</div>`;
    box.appendChild(el);
    const o = document.createElement("option"); o.value = `${b.bank_name} ${b.account_number || b.iban || ""}`.trim(); o.textContent = `${b.bank_name} (${b.currency})`; sel.appendChild(o);
  });
  box.querySelectorAll(".copy").forEach((c) => c.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(c.dataset.v); c.textContent = t("copied"); setTimeout(() => (c.textContent = t("copy")), 1500); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }));
}

function history() {
  const box = $("hist");
  if (!ACC.payments.length) { $("sec-hist").hidden = true; return; }
  $("sec-hist").hidden = false;
  box.innerHTML = ACC.payments.map((p) => {
    const cls = { "Waiting for check": "w", Verified: "v", Rejected: "r" }[p.status] || "w";
    const lbl = t({ w: "h_w", v: "h_v", r: "h_r" }[cls]);
    const cov = p.period_from ? t("covers", { a: fmtDate(p.period_from), b: fmtDate(p.period_to) }) : "";
    return `<div class="pay"><div><b class="num">${esc(p.currency)} ${num(p.amount)}</b> · ${esc(pn(p.plan))} (${esc(t(p.billing_period === "Yearly" ? "yearly" : "monthly"))})<br>
      <small>${esc(fmtDate(String(p.creation).slice(0, 10)))}${p.reference ? " · " + esc(p.reference) : ""}${cov ? " · " + esc(cov) : ""}${p.reject_reason ? " · " + esc(p.reject_reason) : ""}</small></div>
      <span class="pill ${cls}">${esc(lbl)}</span></div>`;
  }).join("");
}

let PROOF = null;
$("proof").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) { PROOF = null; $("proof-img").hidden = true; return; }
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    PROOF = c.toDataURL("image/jpeg", 0.82); $("proof-img").src = PROOF; $("proof-img").hidden = false; URL.revokeObjectURL(url);
  };
  img.src = url;
});

function msgOf(j) {
  try { if (j && j._server_messages) return JSON.parse(j._server_messages).map((x) => { try { return JSON.parse(x).message; } catch (e) { return x; } }).join(" ").replace(/<[^>]+>/g, ""); } catch (e) {}
  if (j && j.exception) return String(j.exception).replace(/^[\w.]+:\s*/, "");
  return "";
}
async function api(method, data) {
  const r = await fetch("/api/method/" + method, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json", "X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || "" }, body: JSON.stringify(data || {}) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(msgOf(j) || t("e_load"));
  return j.message;
}
function say(cls, text) { const m = $("pay-msg"); m.className = "msg " + cls; m.textContent = text; m.hidden = !text; }

$("pay").addEventListener("submit", async (ev) => {
  ev.preventDefault(); say("", "");
  const amount = parseFloat(String($("amount").value).replace(/,/g, ""));
  if (!(amount > 0)) return say("bad", t("e_amount"));
  if (!$("reference").value.trim() && !PROOF) return say("bad", t("e_ref"));
  const btn = $("pay-go"); btn.disabled = true;
  try {
    await api("mimaar.saas.tenant.pay", { data: { plan: PLAN, billing_period: PERIOD, periods: 1, currency: $("currency").value, amount, paid_on: $("paid_on").value || null,
      paid_to: $("paid_to").value, reference: $("reference").value.trim(), note: $("note").value.trim(), proof: PROOF } });
    say("ok", t("sent_ok")); $("reference").value = ""; $("note").value = ""; $("proof").value = ""; PROOF = null; $("proof-img").hidden = true;
    load();
  } catch (e) { say("bad", e.message); }
  finally { btn.disabled = false; }
});

async function load() {
  if (!CFG.owner) { $("not-owner").hidden = false; $("loading").hidden = true; return; }
  try {
    ACC = await api("mimaar.saas.tenant.billing");
    if (ACC.state) header(ACC.state);
    if (!load.done) PERIOD = ACC.billing_period === "Yearly" ? "Yearly" : "Monthly";
    load.done = true;
    PLAN = PLAN || ACC.plan || (ACC.plans[0] && ACC.plans[0].name);
    ["sec-plan", "sec-banks", "sec-form"].forEach((x) => ($(x).hidden = false));
    $("paid_on").value = $("paid_on").value || CFG.today;
    plans(); banks(); history();
    const sp = ACC.support || {};
    $("support").textContent = sp.email && sp.whatsapp ? t("support", { e: sp.email, w: "+" + sp.whatsapp }) : sp.email ? t("support_e", { e: sp.email }) : "";
    $("loading").hidden = true;
  } catch (e) { $("loading").textContent = e.message || t("e_load"); }
}
load();
</script>
</body>
</html>
