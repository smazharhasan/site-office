<style>
/* One card on a light page: what it is about, an optional rating, the message, who is writing */
:root{
  --blue:#1E3A5F; --navy:#0F2238; --blue-2:#284B78; --amber:#F2B01E; --ink:#14202B; --muted:#5B6875; --bg:#F2F5F8; --card:#FFFFFF; --line:#DCE2E8; --field:#F7F9FA;
  --ok:#1C7148; --bad:#B3402A; --on-blue:#E9F0F8; --on-blue-2:#B9CBE0;
  --display:"Poppins","Segoe UI",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif; --ar:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--ink:#E6EBF0; --muted:#9EABB8; --bg:#0F151C; --card:#17202A; --line:#2B3744; --field:#121A22; --ok:#5FD198; --bad:#F08A72; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh}
[dir=rtl] body{font-family:var(--ar)}
html[lang=ur] body{font-family:var(--ur);line-height:2.05}
.top{background:var(--navy);color:var(--on-blue);position:relative;overflow:hidden;padding:20px max(16px,env(safe-area-inset-left,0px)) 96px}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(var(--on-blue-2) 1px,transparent 1px),linear-gradient(90deg,var(--on-blue-2) 1px,transparent 1px);background-size:28px 28px}
.top>*{position:relative}
.bar{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo svg:first-child{width:38px;height:38px}
.logo .bd-name{height:24px;width:auto}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--on-blue);font:500 .85rem/1 var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed=true]{background:#fff;color:var(--blue)}
.langs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.langs .ur{font-family:var(--ur)} .langs .ar{font-family:var(--ar)}
.head{max-width:640px;margin:34px auto 0}
.head h1{font:800 clamp(1.7rem,4.4vw,2.4rem)/1.12 var(--display);margin:0 0 10px;color:#fff;letter-spacing:-.02em}
html[lang=ur] .head h1{font:600 clamp(1.6rem,4vw,2.1rem)/1.9 var(--ur);letter-spacing:0}
html[lang=ar] .head h1{font:700 clamp(1.6rem,4vw,2.1rem)/1.45 var(--ar);letter-spacing:0}
.head p{margin:0;color:var(--on-blue-2);max-width:56ch}
main{position:relative;z-index:1;max-width:640px;margin:-64px auto 48px;padding:0 max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:18px;box-shadow:0 18px 50px rgba(15,34,56,.12)}
.f{display:grid;gap:8px;min-width:0;align-content:start}
.f>label,.f>.lab{font-weight:600;font-size:.95rem}
.help{font-size:.84rem;color:var(--muted);font-weight:400}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kind{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--field);display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind svg{width:22px;height:22px;flex:none;color:var(--blue-2)}
@media (prefers-color-scheme: dark){.kind svg{color:var(--amber)}}
.kind:has(input:checked){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--card))}
.kind:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-start}
[dir=rtl] .stars{justify-content:flex-end}
.stars button{border:0;background:transparent;padding:2px;cursor:pointer;color:var(--line);line-height:0}
.stars button svg{width:34px;height:34px}
.stars button.on{color:var(--amber)}
.stars button:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}.kinds{grid-template-columns:1fr}}
input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:150px;resize:vertical}
html[lang=ur] textarea{line-height:2}
input:focus,textarea:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
.ltr{direction:ltr;text-align:left}
[dir=rtl] .ltr{text-align:right}
.btn{appearance:none;border:0;border-radius:999px;background:var(--amber);color:#1B1405;font:700 1.02rem/1 var(--display);padding:16px 18px;cursor:pointer;min-height:52px;width:100%}
html[lang=ur] .btn{font:600 1rem/1.6 var(--ur)} html[lang=ar] .btn{font:700 1rem/1.4 var(--ar)}
.btn:hover{filter:brightness(1.05)} .btn:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--blue-2);border:1.5px solid var(--line)}
.err{background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;overflow:hidden;opacity:0;clip-path:inset(50%);pointer-events:none}
.done{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.done .tick{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok);display:grid;place-items:center}
.done h2{font:800 1.5rem/1.2 var(--display);margin:0}
html[lang=ur] .done h2{font:600 1.4rem/1.9 var(--ur)} html[lang=ar] .done h2{font:700 1.4rem/1.5 var(--ar)}
.done p{margin:0;color:var(--muted)}
.foot{text-align:center;font-size:.85rem;color:var(--muted);margin-top:18px}
.foot a{color:inherit}
</style>
</head>

<main>
  <form class="card" id="form" novalidate>
    <div class="f" role="radiogroup" aria-labelledby="k-lab">
      <span class="lab" id="k-lab" data-t="k_label"></span>
      <div class="kinds">
        <label class="kind"><input type="radio" name="kind" value="Feedback" checked><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="k_Feedback"></span></label>
        <label class="kind"><input type="radio" name="kind" value="Feature request"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span data-t="k_Feature request"></span></label>
        <label class="kind"><input type="radio" name="kind" value="Problem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span data-t="k_Problem"></span></label>
        <label class="kind"><input type="radio" name="kind" value="Question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 4M12 17v.5"/></svg><span data-t="k_Question"></span></label>
      </div>
    </div>
    <div class="f" id="rate-f">
      <span class="lab" id="r-lab"><span data-t="rating"></span> <span class="help" data-t="optional"></span></span>
      <div class="stars" role="radiogroup" aria-labelledby="r-lab" id="stars"></div>
    </div>
    <div class="f">
      <label for="message" data-t="message"></label>
      <textarea id="message" name="message" maxlength="5000" required></textarea>
    </div>
    <div class="row">
      <div class="f"><label for="name" data-t="name"></label><input type="text" id="name" name="name" autocomplete="name" maxlength="120"></div>
      <div class="f"><label for="email" data-t="email"></label><input type="email" id="email" name="email" class="ltr" autocomplete="email" required maxlength="140"><span class="help" data-t="email_help"></span></div>
    </div>
    <div class="f"><label for="workspace"><span data-t="ws"></span></label><input type="text" id="workspace" name="workspace" class="ltr" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40"><span class="help" data-t="ws_help"></span></div>
    <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <div class="err" id="err" role="alert" hidden></div>
    <button class="btn" type="submit" id="send" data-t="send"></button>
  </form>
  <section class="card done" id="done" hidden aria-live="polite">
    <div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></div>
    <h2 data-t="thanks_t"></h2>
    <p data-t="thanks_d"></p>
    <button class="btn ghost" type="button" id="again" data-t="again"></button>
  </section>
  <p class="foot"><a id="back" href="https://buildiary.app" data-t="back"></a></p>
</main>

    name: "آپ کا نام", email: "ای میل", email_help: "ہم اسی پتے پر جواب دیں گے۔", ws: "ورک اسپیس (اختیاری)", ws_help: "مثلاً my-house",
    send: "بھیجیں", sending: "بھیجا جا رہا ہے…", thanks_t: "شکریہ!", thanks_d: "آپ کا پیغام ہماری ٹیم تک پہنچ گیا ہے۔ اس کی ایک کاپی آپ کی ای میل پر بھیج دی گئی ہے۔", again: "ایک اور پیغام بھیجیں", back: "buildiary.app پر واپس",
    e_msg: "براہِ کرم چند الفاظ لکھیں۔", e_email: "درست ای میل درج کریں۔", e_net: "سرور تک رسائی نہیں ہو سکی۔ انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔", e_many: "بہت زیادہ کوششیں۔ تھوڑی دیر بعد دوبارہ کوشش کریں۔",
  },
  ar: {
    title: "أخبرنا برأيك", lede: "ملاحظات، أو ميزة تحتاجها، أو شيء لا يعمل، أو سؤال: كل ذلك يصل إلى فريقنا، ونحن نقرأ كل رسالة.",
    k_label: "بخصوص ماذا؟", "k_Feedback": "ملاحظات", "k_Feature request": "ميزة أحتاجها", "k_Problem": "شيء لا يعمل", "k_Question": "سؤال",
    rating: "ما مدى رضاك عن بلدائري؟", optional: "(اختياري)", star: "{n} من 5",
    message: "رسالتك", ph_Feedback: "ما الذي يعمل جيداً، وما الذي يمكن تحسينه؟", "ph_Feature request": "ماذا تريد أن يفعل بلدائري؟ وكيف سيساعدك في الموقع؟",
    ph_Problem: "ماذا حدث وماذا كنت تتوقع؟ في أي صفحة أو شاشة؟", ph_Question: "اسألنا عن أي شيء.",
    name: "اسمك", email: "البريد الإلكتروني", email_help: "سنرد على هذا العنوان.", ws: "مساحة العمل (اختياري)", ws_help: "مثلاً my-house",
    send: "إرسال", sending: "جارٍ الإرسال…", thanks_t: "شكراً لك!", thanks_d: "وصلت رسالتك إلى فريقنا، وأرسلنا نسخة منها إلى بريدك.", again: "أرسل رسالة أخرى", back: "العودة إلى buildiary.app",
    e_msg: "يُرجى كتابة بضع كلمات.", e_email: "أدخل بريداً إلكترونياً صحيحاً.", e_net: "تعذّر الوصول إلى الخادم. تحقق من الاتصال وحاول مجدداً.", e_many: "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.",
  },
};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let LANG = ["en", "ur", "ar"].includes(CFG.lang) ? CFG.lang : (store.get("buildiary_lang") || ((navigator.language || "").startsWith("ar") ? "ar" : (navigator.language || "").startsWith("ur") ? "ur" : "en"));
const t = (k, v) => { let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; if (v) for (const x in v) s = s.replace("{" + x + "}", v[x]); return s; };
const $ = (s) => document.querySelector(s);
const form = $("#form");
let rating = 0;

function paint() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
  const k = form.kind.value;
  $("#message").placeholder = t("ph_" + k);
  $("#rate-f").hidden = k !== "Feedback";
  const site = (CFG.website || "https://buildiary.app").replace(/\/$/, "");
  const path = LANG === "en" ? "/" : "/" + LANG + "/";
  $("#home").href = site + path; $("#back").href = site + path;
  stars();
}
function stars() {
  const box = $("#stars");
  box.innerHTML = "";
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", n === rating ? "true" : "false");
    b.setAttribute("aria-label", t("star", { n })); b.className = n <= rating ? "on" : "";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17l-5.8 3.3 1.4-6.4-4.9-4.4 6.5-.7z"/></svg>';
    b.addEventListener("click", () => { rating = rating === n ? 0 : n; stars(); });
    box.appendChild(b);
  }
}
document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("buildiary_lang", LANG); paint(); }));
form.addEventListener("change", (e) => { if (e.target.name === "kind") paint(); });

function msgOf(j, status) {
  if (status === 429) return t("e_many");
  try { if (j && j._server_messages) return JSON.parse(j._server_messages).map((x) => { try { return JSON.parse(x).message; } catch (e) { return x; } }).join(" ").replace(/<[^>]+>/g, ""); } catch (e) {}
  if (j && j.exception) return String(j.exception).replace(/^[\w.]+:\s*/, "");
  return "";
}
async function api(method, data) {
  let r;
  try {
    r = await fetch("/api/method/" + method, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json", "X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || "" }, body: JSON.stringify(data || {}) });
  } catch (e) { throw new Error(t("e_net")); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(msgOf(j, r.status) || t("e_net"));
  return j.message;
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#err"); err.hidden = true;
  const d = { kind: form.kind.value, rating, message: $("#message").value.trim(), name: $("#name").value.trim(), email: $("#email").value.trim(),
    workspace: $("#workspace").value.trim().toLowerCase().replace(/^https?:\/\//, "").split(".")[0], website: form.querySelector("[name=website]").value, language: LANG };
  if (d.message.length < 3) { err.textContent = t("e_msg"); err.hidden = false; $("#message").focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) { err.textContent = t("e_email"); err.hidden = false; $("#email").focus(); return; }
  const btn = $("#send"); btn.disabled = true; btn.textContent = t("sending");
  try {
    await api("buildiary.saas.feedback.submit", { data: JSON.stringify(d) });
    store.set("buildiary_fb_who", JSON.stringify({ name: d.name, email: d.email, workspace: d.workspace }));
    form.hidden = true; $("#done").hidden = false; $("#done").focus && $("#done").scrollIntoView({ block: "center" });
  } catch (x) { err.textContent = x.message; err.hidden = false; }
  btn.disabled = false; btn.textContent = t("send");
});
$("#again").addEventListener("click", () => { $("#message").value = ""; rating = 0; form.hidden = false; $("#done").hidden = true; paint(); $("#message").focus(); });

// filled in from the email's link, or from the last message sent from this browser
(function prefill() {
  let who = {};
  try { who = JSON.parse(store.get("buildiary_fb_who") || "{}"); } catch (e) {}
  $("#name").value = CFG.n || who.name || "";
  $("#email").value = CFG.e || who.email || "";
  $("#workspace").value = CFG.w || who.workspace || "";
  if (CFG.kind) { const r = form.querySelector(`input[name=kind][value="${CFG.kind}"]`); if (r) r.checked = true; }
})();
paint();
</script>
</body>
</html>
