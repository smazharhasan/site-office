<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<title>Start your free trial · Buildiary</title>
<meta name="description" content="Buildiary: construction site management for home owners and builders. Stores, payments, progress and people in English, Urdu and Arabic.">
<link rel="icon" href="/assets/buildiary/images/buildiary-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Kufi+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<script>window.frappe = window.frappe || {};</script>
<!-- csrf_token -->
<style>
/* Layout: blueprint panel with the pitch beside one form card that walks through sign-up → code → set-up → ready */
:root{
  --blue:#1E3A5F; --blue-2:#284B78; --amber:#F2B01E; --ink:#14202B; --muted:#5B6875; --bg:#EEF1F4; --card:#FFFFFF; --line:#D5DBE1; --field:#F7F9FA;
  --ok:#1C7148; --bad:#B3402A; --on-blue:#E9F0F8; --on-blue-2:#B9CBE0;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif; --ar:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--ink:#E6EBF0; --muted:#9EABB8; --bg:#0F151C; --card:#17202A; --line:#2B3744; --field:#121A22; --ok:#5FD198; --bad:#F08A72; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh}
[dir=rtl] body{font-family:var(--ar)}
html[lang=ur] body{font-family:var(--ur);line-height:2.05}
html[lang=ur] .num, html[lang=ar] .num{font-family:var(--body)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);min-height:100vh}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
/* the blueprint side */
.pitch{background:var(--blue);color:var(--on-blue);position:relative;overflow:hidden;
  padding-block:32px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.pitch::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:linear-gradient(var(--on-blue-2) 1px,transparent 1px),linear-gradient(90deg,var(--on-blue-2) 1px,transparent 1px);background-size:28px 28px}
.pitch>*{position:relative}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo svg{width:40px;height:40px}
.logo b{font:800 1.6rem/1 var(--display);letter-spacing:-.01em}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--on-blue);font:500 .85rem/1 var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed=true]{background:#fff;color:var(--blue)}
.langs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.langs .ur{font-family:var(--ur)} .langs .ar{font-family:var(--ar)}
.hero{display:grid;gap:16px;max-width:34rem;margin-top:clamp(8px,4vh,48px)}
.how{display:grid;gap:12px;max-width:34rem;padding:18px 20px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.05)}
.how h3{margin:0;font:700 .8rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
html[lang=ur] .how h3,html[lang=ar] .how h3,html[lang=ur] .dim,html[lang=ar] .dim{font-family:inherit;font-weight:600;font-size:.95rem;line-height:1.6;letter-spacing:0;text-transform:none}
.how ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:s}
.how li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--amber);color:#1B1405;font:700 .85rem/26px var(--display);text-align:center}
.how b{display:block;color:#fff;font-weight:600}.how span{color:var(--on-blue-2);font-size:.92rem}
.by{margin-top:auto}
@media (min-width:901px){.pitch{position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:28px 28px;gap:24px}}
@media (min-width:901px) and (max-height:760px){.points{display:none}}
.hero h1{font:800 clamp(2rem,4.2vw,3.1rem)/1.06 var(--display);margin:0;color:#fff;text-wrap:balance;letter-spacing:-.01em}
html[lang=ur] .hero h1{font:600 clamp(1.7rem,3.4vw,2.5rem)/1.9 var(--ur)}
html[lang=ar] .hero h1{font:700 clamp(1.8rem,3.6vw,2.6rem)/1.45 var(--ar)}
.hero p{margin:0;color:var(--on-blue-2);font-size:1.06rem}
.points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.points li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.points svg{width:22px;height:22px;margin-top:3px}
.dim{display:flex;align-items:center;gap:10px;font:500 .8rem/1 var(--mono);color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.dim::before,.dim::after{content:"";height:1px;flex:1;background:var(--amber);opacity:.6}
.by{display:inline-flex;align-items:center;gap:12px;font-size:.85rem;color:var(--on-blue-2);text-decoration:none}
.by img{height:34px;width:auto;display:block}
/* the form side */
.side{padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:480px;display:grid;gap:14px}
.card h2{font:750 1.45rem/1.15 var(--display);margin:0}
html[lang=ur] .card h2{font:600 1.35rem/2 var(--ur)} html[lang=ar] .card h2{font:700 1.35rem/1.5 var(--ar)}
.lede{color:var(--muted);margin:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;cursor:pointer;background:var(--field)}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font:700 1rem/1.3 var(--display)}
html[lang=ur] .mode b{font:600 1rem/1.9 var(--ur)} html[lang=ar] .mode b{font:700 1rem/1.5 var(--ar)}
.mode span{font-size:.86rem;color:var(--muted)}
.mode .price{font:500 .8rem/1.4 var(--mono);color:var(--blue-2)}
@media (prefers-color-scheme: dark){.mode .price{color:var(--on-blue-2)}}
.mode:has(input:checked){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--card))}
.mode:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.f{display:grid;gap:6px;min-width:0;align-content:start}
.f label{font-weight:600;font-size:.92rem}
.f .help{font-size:.82rem;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
input[type=text],input[type=email],input[type=tel],input[type=password],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
@media (prefers-color-scheme: dark){input:focus,select:focus{border-color:var(--amber)}}
.addr{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden;direction:ltr}
.addr:focus-within{border-color:var(--blue-2)}
.addr input{border:0;border-radius:0;background:transparent;min-width:0;flex:1;font-family:var(--mono);box-shadow:none!important}
.addr span{display:flex;align-items:center;padding:0 12px;font:500 .85rem/1 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--line) 40%,transparent);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.tel{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden;direction:ltr}
.tel:focus-within{border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
.tel .dial{direction:ltr;unicode-bidi:isolate;display:flex;align-items:center;gap:8px;padding:0 10px;font:500 .95rem/1 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--line) 40%,transparent);white-space:nowrap}
.tel input{border:0;border-radius:0;background:transparent;min-width:0;flex:1;box-shadow:none!important}
.flag{width:24px;height:18px;border-radius:3px;object-fit:cover;flex:none;background:var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cp{position:relative}
.cp-btn{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;cursor:pointer;text-align:start}
.cp-btn:focus-visible,.cp-btn[aria-expanded=true]{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
.cp-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-btn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.cp-pop{position:absolute;z-index:30;inset-inline:0;top:calc(100% + 6px);min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(15,25,40,.2);padding:8px;display:grid;gap:6px}
.cp-pop input{min-height:40px}
.cp-pop ul{list-style:none;margin:0;padding:0;max-height:min(330px,52vh);overflow-y:auto;overscroll-behavior:contain}
.cp-pop li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.95rem}
.cp-pop li.on{background:color-mix(in srgb,var(--blue-2) 12%,transparent)}
.cp-pop li[aria-selected=true]{font-weight:600}
.cp-pop li .dc{margin-inline-start:auto;color:var(--muted);font:500 .8rem var(--mono);direction:ltr;unicode-bidi:isolate}
#phone-state{unicode-bidi:plaintext;text-align:start}
.cp-pop li.sep{cursor:default;padding:8px 10px 4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:4px;border-radius:0}
html[lang=ur] .cp-pop li.sep,html[lang=ar] .cp-pop li.sep{letter-spacing:0;text-transform:none;font-size:.82rem}
.cp-pop li.none{cursor:default;color:var(--muted)}
.state{font-size:.84rem;min-height:1.3em}
.state.ok{color:var(--ok)} .state.bad{color:var(--bad)}
.pw{position:relative}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--blue-2);font:600 .8rem var(--body);padding:8px;cursor:pointer}
@media (prefers-color-scheme: dark){.pw button{color:var(--amber)}}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.agree input{width:20px;height:20px;margin-top:3px;accent-color:var(--blue)}
.agree a{color:inherit}
.btn{appearance:none;border:0;border-radius:12px;background:var(--amber);color:#1B1405;font:700 1.02rem/1 var(--display);padding:16px 18px;cursor:pointer;min-height:52px;width:100%}
html[lang=ur] .btn{font:600 1rem/1.6 var(--ur)} html[lang=ar] .btn{font:700 1rem/1.4 var(--ar)}
.btn:hover{filter:brightness(1.05)} .btn:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--blue-2);border:1.5px solid var(--line)}
@media (prefers-color-scheme: dark){.btn.ghost{color:var(--ink)}}
.err{background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;overflow:hidden;opacity:0;clip-path:inset(50%);pointer-events:none}
.code{font:600 1.8rem/1 var(--mono)!important;letter-spacing:.4em;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;color:var(--muted)}
.steps i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:block;position:relative}
.steps li.on{color:var(--ink)} .steps li.on i{border-color:var(--amber);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.done{color:var(--ink)} .steps li.done i{border-color:var(--ok);background:var(--ok)}
.steps li.done i::after{content:"";position:absolute;left:6px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.steps li.on i{animation:none}}
.ready{display:grid;gap:12px;text-align:center;justify-items:center}
.ready svg{width:64px;height:64px}
.where{font:500 1rem/1.4 var(--mono);background:var(--field);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;direction:ltr}
.small{font-size:.86rem;color:var(--muted)}
.small a{color:inherit}
.bd-d{font-style:normal;color:#F2B01E}
</style>
</head>
<body>
<div class="wrap">
  <section class="pitch">
    <div class="brand">
      <a class="logo" href="#" aria-label="Buildiary">
        <svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#fff" fill-opacity=".1"/><path d="M53.5 18H45A24 24 0 0 0 21 42V78A24 24 0 0 0 45 102H53.5Z M53.5 30H44A11 11 0 0 0 33 41V52.5H53.5Z M53.5 64.5H33V79A11 11 0 0 0 44 90H53.5Z M66.5 18H75A24 24 0 0 1 99 42V78A24 24 0 0 1 75 102H66.5Z M66.5 30V90H76A11 11 0 0 0 87 79V41A11 11 0 0 0 76 30Z" fill="#FFFFFF" fill-rule="evenodd"/><rect x="53.5" y="18" width="13.0" height="84" fill="#F2B01E"/></svg>
        <b>Buil<i class="bd-d">d</i>iary</b>
      </a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ur" class="ur">اردو</button>
        <button type="button" data-lang="ar" class="ar">العربية</button>
      </div>
    </div>
    <div class="hero">
      <div class="dim" data-t="dim"></div>
      <h1 data-t="hero"></h1>
      <p data-t="sub"></p>
      <ul class="points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#F2B01E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg><span data-t="p1"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#F2B01E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg><span data-t="p2"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#F2B01E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg><span data-t="p3"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#F2B01E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg><span data-t="p4"></span></li>
      </ul>
    </div>
    <div class="how"><h3 data-t="how"></h3><ol>
      <li><div><b data-t="h1"></b><span data-t="h1d"></span></div></li>
      <li><div><b data-t="h2"></b><span data-t="h2d"></span></div></li>
      <li><div><b data-t="h3"></b><span data-t="h3d"></span></div></li>
    </ol></div>
    <a class="by" href="https://www.smhglobal.com.pk" target="_blank" rel="noopener"><span data-t="by_short"></span><img src="/assets/buildiary/images/smh-global-light.svg" alt="SMH Global Services"></a>
  </section>

  <main class="side">
    <!-- 1. sign-up -->
    <form class="card" id="s-form" novalidate>
      <div style="display:grid;gap:6px"><h2 data-t="title"></h2><p class="lede" id="trial-note"></p></div>
      <div class="f">
        <label data-t="q_mode"></label>
        <div class="modes">
          <label class="mode"><input type="radio" name="mode" value="Owner" id="m-owner" checked><b data-t="owner_t"></b><span data-t="owner_d"></span><span class="price num" id="price-Owner"></span></label>
          <label class="mode"><input type="radio" name="mode" value="Builder" id="m-builder"><b data-t="builder_t"></b><span data-t="builder_d"></span><span class="price num" id="price-Builder"></span></label>
        </div>
      </div>
      <div class="row">
        <div class="f"><label for="contact_name" data-t="name"></label><input type="text" id="contact_name" autocomplete="name" required maxlength="120"></div>
        <div class="f"><label for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" required maxlength="140" dir="ltr"></div>
      </div>
      <div class="row">
        <div class="f"><label for="country-btn" data-t="country"></label>
          <div class="cp" id="cp">
            <button type="button" class="cp-btn" id="country-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="cp-pop"><img class="flag" id="cp-flag" alt="" width="24" height="18"><span class="nm" id="cp-name"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <input type="hidden" id="country">
            <div class="cp-pop" id="cp-pop" hidden><input type="search" id="cp-q" autocomplete="off" spellcheck="false" aria-controls="cp-list"><ul role="listbox" id="cp-list" aria-labelledby="country-btn"></ul></div>
          </div>
        </div>
        <div class="f"><label for="phone" data-t="phone"></label><div class="tel"><span class="dial" id="dial"></span><input type="tel" id="phone" autocomplete="tel-national" inputmode="tel" maxlength="40" required></div><div class="state" id="phone-state" aria-live="polite"></div></div>
      </div>
      <div class="row">
        <div class="f"><label for="city" data-t="city"></label><input type="text" id="city" autocomplete="address-level2" maxlength="80"></div>
        <div class="f"><label for="company_name" id="l-company"></label><input type="text" id="company_name" required maxlength="120"></div>
      </div>
      <div class="f">
        <label for="subdomain" data-t="address"></label>
        <div class="addr"><input type="text" id="subdomain" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="30" inputmode="url"><span id="base"></span></div>
        <div class="state" id="sub-state" aria-live="polite"></div>
        <div class="help" data-t="address_help"></div>
      </div>
      <div class="f">
        <label for="password" data-t="password"></label>
        <div class="pw"><input type="password" id="password" autocomplete="new-password" required minlength="8" dir="ltr"><button type="button" id="pw-toggle" data-t="show"></button></div>
        <div class="help" data-t="password_help"></div>
      </div>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <label class="agree"><input type="checkbox" id="agree"><span id="agree-text"></span></label>
      <div class="err" id="s-err" hidden></div>
      <button class="btn" type="submit" id="s-go" data-t="submit"></button>
      <p class="small" data-t="have_account"></p>
    </form>

    <!-- 2. email code -->
    <form class="card" id="s-verify" hidden novalidate>
      <h2 data-t="verify_t"></h2>
      <p class="lede" id="verify-d"></p>
      <div class="f"><label for="code" data-t="code"></label><input type="text" id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr"></div>
      <div class="err" id="v-err" hidden></div>
      <button class="btn" type="submit" id="v-go" data-t="verify_btn"></button>
      <button class="btn ghost" type="button" id="v-resend" data-t="resend"></button>
    </form>

    <!-- 3. set-up -->
    <section class="card" id="s-setup" hidden aria-live="polite">
      <h2 data-t="setup_t"></h2>
      <p class="lede" data-t="setup_d"></p>
      <ul class="steps"><li id="st1"><i></i><span data-t="step1"></span></li><li id="st2"><i></i><span data-t="step2"></span></li><li id="st3"><i></i><span data-t="step3"></span></li></ul>
      <div class="where" id="setup-where"></div>
      <p class="small" id="slow" data-t="slow" hidden></p>
    </section>

    <!-- 4. ready -->
    <section class="card" id="s-ready" hidden>
      <div class="ready">

const flagUrl = (code) => "/assets/buildiary/flags/" + code + ".svg";
const DN = {};
function cname(c) {
  if (LANG === "en") return c.n;
  try { DN[LANG] = DN[LANG] || new Intl.DisplayNames([LANG], { type: "region" }); const v = DN[LANG].of(c.c.toUpperCase()); if (v && v !== c.c.toUpperCase()) return v; } catch (e) {}
  return I18N[LANG] && I18N[LANG]["c_" + c.n] || c.n;
}
function guessCountry() {
  const q = (CFG.country || "").trim();
  if (q) { const c = BY_NAME[q] || BY_CODE[q.toLowerCase()]; if (c) return c.n; }
  const saved = store.get("buildiary_country"); if (saved && BY_NAME[saved]) return saved;
  try { const code = CFG.zones[Intl.DateTimeFormat().resolvedOptions().timeZone]; if (code && BY_CODE[code]) return BY_CODE[code].n; } catch (e) {}
  const m = (navigator.language || "").match(/-([A-Za-z]{2})$/);

  return "Pakistan";
}

  const c = BY_NAME[country], cur = c && c.m, v = cur && cur !== "USD" && p.local && p.local[cur];

  return cur + " " + Number(v).toLocaleString("en") + " ($" + p.month + ")";
}

}

function paintCountry() {
  const c = BY_NAME[COUNTRY] || BY_NAME.Pakistan;
  $("country").value = c.n; $("cp-flag").src = flagUrl(c.c); $("cp-name").textContent = cname(c);
  $("dial").textContent = c.d; $("phone").placeholder = c.e || "";
}
function setCountry(name, byUser) {
  COUNTRY = name; if (byUser) store.set("buildiary_country", name);
  paintCountry(); prices(); if ($("phone").value.trim()) checkPhone(true);
}
function options() { return [...$("cp-list").querySelectorAll("li[role=option]")]; }
function mark(i) {
  const o = options(); if (!o.length) return;
  ACTIVE = Math.max(0, Math.min(i, o.length - 1));
  o.forEach((li, k) => li.classList.toggle("on", k === ACTIVE));
  o[ACTIVE].scrollIntoView({ block: "nearest" });
  $("cp-q").setAttribute("aria-activedescendant", o[ACTIVE].id);
}
function renderList(q) {
  const ul = $("cp-list"), qq = (q || "").trim().toLowerCase().replace(/^\+/, "");
  ul.innerHTML = ""; let shown = 0, sel = 0;
  // while searching: names that start with the text first, then the rest that contain it
  const rank = (c) => { const a = cname(c).toLowerCase(), b = c.n.toLowerCase(); return a.startsWith(qq) || b.startsWith(qq) || c.d.replace("+", "").startsWith(qq) ? 0 : 1; };
  const list = qq ? CFG.countries.filter((c) => { const a = cname(c).toLowerCase(); return a.includes(qq) || c.n.toLowerCase().includes(qq) || c.d.replace("+", "").startsWith(qq); }).sort((x, y) => rank(x) - rank(y)) : CFG.countries;
  list.forEach((c, i) => {
    const name = cname(c);
    if (!qq && i === CFG.top) { const s = document.createElement("li"); s.className = "sep"; s.setAttribute("role", "presentation"); s.textContent = t("other_countries"); ul.appendChild(s); }
    const li = document.createElement("li");
    li.setAttribute("role", "option"); li.id = "cp-" + c.c; li.dataset.n = c.n; li.setAttribute("aria-selected", c.n === COUNTRY ? "true" : "false");
    li.innerHTML = `<img class="flag" loading="lazy" src="${flagUrl(c.c)}" alt="" width="24" height="18"><span>${esc(name)}</span><span class="dc">${esc(c.d)}</span>`;
    if (c.n === COUNTRY) sel = shown;
    ul.appendChild(li); shown++;
  });
  if (!shown) { const n = document.createElement("li"); n.className = "none"; n.textContent = t("no_match"); ul.appendChild(n); ACTIVE = -1; return; }
  mark(qq ? 0 : sel);
}
function openPicker() {
  $("cp-pop").hidden = false; $("country-btn").setAttribute("aria-expanded", "true");
  $("cp-q").value = ""; renderList(""); $("cp-q").focus();
}
function closePicker(focusBtn) {
  $("cp-pop").hidden = true; $("country-btn").setAttribute("aria-expanded", "false");
  if (focusBtn) $("country-btn").focus();
}
$("country-btn").addEventListener("click", () => { if ($("cp-pop").hidden) openPicker(); else closePicker(true); });
$("country-btn").addEventListener("keydown", (e) => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); openPicker(); } });
$("cp-q").addEventListener("input", () => renderList($("cp-q").value));
$("cp-q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); mark(ACTIVE + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); mark(ACTIVE - 1); }
  else if (e.key === "Enter") { e.preventDefault(); const o = options()[ACTIVE]; if (o) { setCountry(o.dataset.n, true); closePicker(true); } }
  else if (e.key === "Escape") { e.preventDefault(); closePicker(true); }
  else if (e.key === "Tab") closePicker(false);
});
$("cp-list").addEventListener("click", (e) => { const li = e.target.closest("li[role=option]"); if (li) { setCountry(li.dataset.n, true); closePicker(true); } });
document.addEventListener("pointerdown", (e) => { if (!$("cp-pop").hidden && !$("cp").contains(e.target)) closePicker(false); });

// the mobile number, checked in the country's own format
let phoneT = null, PHONE_OK = null, PHONE_MSG = "";
function phoneState(cls, text) { const s = $("phone-state"); s.className = "state " + (cls || ""); s.textContent = text || ""; }
function phoneMsg(r) {
  const c = BY_NAME[COUNTRY] || {}, ex = (c.e ? c.e + " (" + c.d + ")" : c.d || "");
  return t("e_phone_" + (r.problem || "invalid"), { country: cname(c), ex });
}
function checkPhone(now) {
  clearTimeout(phoneT);
  const v = $("phone").value.trim();
  if (!v) { PHONE_OK = null; phoneState("", ""); return Promise.resolve(); }
  return new Promise((done) => {
    phoneT = setTimeout(async () => {
      try {
        const r = await api("buildiary.saas.signup.check_phone", { phone: v, country: COUNTRY }, true);
        PHONE_OK = !!r.ok; PHONE_MSG = r.ok ? "" : phoneMsg(r);
        phoneState(r.ok ? "ok" : "bad", r.ok ? "✓ " + r.number : PHONE_MSG);
      } catch (e) { PHONE_OK = null; }
      done();
    }, now ? 0 : 700);
  });
}
$("phone").addEventListener("input", () => { const el = $("phone"), v = el.value.replace(/[^\d+\s()-]/g, ""); if (v !== el.value) el.value = v; checkPhone(false); });
$("phone").addEventListener("blur", () => checkPhone(true));
$("pw-toggle").addEventListener("click", () => { const p = $("password"); p.type = p.type === "password" ? "text" : "password"; paint(); });
$("base").textContent = "." + CFG.base;

function msgOf(j, status) {
  if (status === 429) return t("e_many");
  try {
    if (j && j._server_messages) return JSON.parse(j._server_messages).map((x) => { try { return JSON.parse(x).message; } catch (e) { return x; } }).join(" ").replace(/<[^>]+>/g, "");
  } catch (e) {}
  if (j && j.exception) return String(j.exception).replace(/^[\w.]+:\s*/, "");
  return "";
}
async function api(method, data, get) {
  let url = "/api/method/" + method, opt;
  if (get) { url += "?" + new URLSearchParams(data || {}); opt = { method: "GET", headers: { Accept: "application/json" } }; }
  else opt = { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json", "X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || "" }, body: JSON.stringify(data || {}) };
  let r;
  try { r = await fetch(url, opt); } catch (e) { throw new Error(t("e_net")); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(msgOf(j, r.status) || t("e_net"));
  return j.message;
}

// workspace name: suggested from the company name until the person types their own
let subTouched = false, subTimer = null, subOk = false;
function subState(cls, text) { const s = $("sub-state"); s.className = "state " + (cls || ""); s.textContent = text || ""; }
function checkSub(byCompany) {
  clearTimeout(subTimer);
  subTimer = setTimeout(async () => {
    const name = $("subdomain").value.trim();
    if (!byCompany && !/^[a-z][a-z0-9-]{1,28}[a-z0-9]$/.test(name)) { subOk = false; subState("bad", name ? t("e_sub") : ""); return; }
    subState("", t("checking"));
    try {
      const r = byCompany ? await api("buildiary.saas.signup.check", { company: $("company_name").value }, true) : await api("buildiary.saas.signup.check", { name }, true);
      if (byCompany && !subTouched) $("subdomain").value = r.name;
      subOk = !!r.ok;
      subState(r.ok ? "ok" : "bad", r.ok ? "✓ " + t("available") + " · " + r.host : r.message);
    } catch (e) { subState("bad", e.message); }
  }, 450);
}
$("company_name").addEventListener("input", () => { if (!subTouched && $("company_name").value.trim().length > 1) checkSub(true); });
$("subdomain").addEventListener("input", () => {
  subTouched = true;
  const el = $("subdomain"), v = el.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
  if (v !== el.value) el.value = v;
  checkSub(false);
});

function show(id) { ["s-form", "s-verify", "s-setup", "s-ready", "s-failed"].forEach((x) => { $(x).hidden = x !== id; }); window.scrollTo({ top: 0, behavior: "smooth" }); }
function fail(box, msg) { const e = $(box); e.textContent = msg; e.hidden = !msg; if (msg) e.scrollIntoView({ block: "nearest" }); }

$("s-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  fail("s-err", "");
  const d = {
    mode: $("m-builder").checked ? "Builder" : "Owner", contact_name: $("contact_name").value.trim(), phone: $("phone").value.trim(), email: $("email").value.trim(),
    country: COUNTRY, city: $("city").value.trim(), company_name: $("company_name").value.trim(), subdomain: $("subdomain").value.trim(),
    password: $("password").value, agree: $("agree").checked ? 1 : 0, language: LANG, website: $("website").value,
  };
  if (!CFG.open) return fail("s-err", t("e_closed"));
  if (!d.contact_name || !d.email || !d.company_name || !d.subdomain || !d.password) return fail("s-err", t("e_fill"));
  if (!d.phone) { $("phone").focus(); return fail("s-err", t("e_phone_empty")); }
  await checkPhone(true);
  if (PHONE_OK === false) { $("phone").focus(); return fail("s-err", PHONE_MSG); }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return fail("s-err", t("e_email"));
  if (!/^[a-z][a-z0-9-]{1,28}[a-z0-9]$/.test(d.subdomain)) return fail("s-err", t("e_sub"));
  if (d.password.length < 8 || !/[A-Za-z]/.test(d.password) || !/\d/.test(d.password)) return fail("s-err", t("e_pw"));
  if (!d.agree) return fail("s-err", t("e_agree"));
  const btn = $("s-go"); btn.disabled = true; btn.textContent = t("working");
  try {
    const r = await api("buildiary.saas.signup.start", { data: d });
    EMAIL = r.email; sess.set("buildiary_signup", JSON.stringify({ token: r.token, email: r.email, host: r.host }));
    paint();
    if (r.verify) { show("s-verify"); $("code").focus(); } else follow(r.token, r.host);
  } catch (e) { fail("s-err", e.message); }
  finally { btn.disabled = false; btn.textContent = t("submit"); }
});

$("s-verify").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  fail("v-err", "");
  const code = $("code").value.replace(/\D/g, "");
  if (code.length !== 6) return fail("v-err", t("e_code"));
  const s = JSON.parse(sess.get("buildiary_signup") || "{}");
  const btn = $("v-go"); btn.disabled = true;
  try { await api("buildiary.saas.signup.verify", { token: s.token, code }); follow(s.token, s.host); }
  catch (e) { fail("v-err", e.message); }
  finally { btn.disabled = false; }
});
$("v-resend").addEventListener("click", async () => {
  const s = JSON.parse(sess.get("buildiary_signup") || "{}");
  try { await api("buildiary.saas.signup.resend", { token: s.token }); fail("v-err", ""); $("v-resend").textContent = t("sent"); }
  catch (e) { fail("v-err", e.message); }
});

let pollT = null;
function follow(token, host) {
  show("s-setup");
  $("setup-where").textContent = host || "";
  const started = Date.now();
  const steps = ["st1", "st2", "st3"];
  const mark = (n) => steps.forEach((s, i) => { $(s).className = i < n ? "done" : i === n ? "on" : ""; });
  mark(0);
  const tick = async () => {
    const secs = (Date.now() - started) / 1000;
    mark(secs < 25 ? 0 : secs < 55 ? 1 : 2);
    if (secs > 100) $("slow").hidden = false;
    try {
      const r = await api("buildiary.saas.signup.status", { token }, true);
      if (r.url) {
        mark(3); sess.del("buildiary_signup");
        EMAIL = r.email; paint();
        $("ready-where").textContent = r.host; $("ready-go").href = r.url + "?usr=" + encodeURIComponent(r.email);
        return setTimeout(() => show("s-ready"), 500);
      }
      if (r.status === "Failed") { $("failed-d").textContent = r.message || ""; sess.del("buildiary_signup"); return show("s-failed"); }
      if (r.status === "Verifying email") return show("s-verify");
    } catch (e) {}
    pollT = setTimeout(tick, 3000);
  };
  tick();
}

paint();
const resume = JSON.parse(sess.get("buildiary_signup") || "null");
if (resume && resume.token) { EMAIL = resume.email; paint(); follow(resume.token, resume.host); }
</script>
